<!DOCTYPE html>
<html lang="es" data-mafia-cards="street-style">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta del local · MAFIA</title>
<meta name="description" content="Carta de MAFIA para el local. Pizzas, pastas y combos.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#A82A25">
<link rel="icon" type="image/png" href="/favicon.png?v=mafia-20261003-2">
<link rel="apple-touch-icon" href="/favicon.png?v=mafia-20261003-2">
<link rel="preload" href="/fonts/PestoMafio.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pesto Mafio";src:url("/fonts/PestoMafio.ttf") format("truetype");font-style:normal;font-weight:400;font-display:block}
:root{
  --bg:#0c0c0c; --surface:#161514; --line:#2a2826;
  --text:#f3ede2; --muted:#a39d92;
  --red:#c8102e; --red-hi:#e0213f; --red-dim:rgba(200,16,46,.16);
  --r:14px;          /* una sola forma para todo: fotos, botones, formatos, paneles */
  --mw:108px;        /* ancho de la foto y del botón de precio (siempre iguales) */
  --serif:"Pesto Mafio","Playfair Display",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
@media(min-width:600px){:root{--mw:128px}}
@media(max-width:340px){:root{--mw:92px}}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 var(--sans);
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:3px}

/* ---------- Cabecera ---------- */
.top{padding:calc(40px + env(safe-area-inset-top,0px)) 20px 32px;text-align:center}
.brand{font:400 clamp(48px,13vw,96px)/.9 var(--serif);letter-spacing:.05em;color:var(--red)}
.brand .logo{display:block;margin:0 auto;width:auto;height:auto;max-width:70%;max-height:clamp(56px,15vw,88px)}
.online-label{margin:12px 0 0;font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--text)}
.online-note{margin:11px auto 0;max-width:520px;font-size:12px;line-height:1.35;color:var(--muted)}
.online-note b{color:var(--text);font-weight:700}
 .info{margin:12px auto 0;max-width:34ch;font-size:13px;line-height:1.45;color:var(--text);opacity:.78}

/* ---------- Navegación de categorías ---------- */
.nav{position:sticky;top:0;z-index:20;background:rgba(12,12,12,.93);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1160px;margin:0 auto;display:flex;align-items:center}
.nav ul{position:relative;flex:1;min-width:0;list-style:none;display:flex;gap:8px;overflow-x:auto;padding:12px 8px 12px 16px;scrollbar-width:none}
.cartbtn{position:relative;flex:none;width:44px;height:44px;margin:0 14px 0 4px;display:grid;place-items:center;border-radius:var(--r);border:1px solid var(--text);background:var(--text);color:#16130f;transition:filter .15s}
.cartbtn::before{content:"";position:absolute;right:100%;top:-8px;bottom:-8px;width:20px;background:linear-gradient(to left,var(--bg),transparent);pointer-events:none}
.cartbtn:hover{filter:brightness(.92)}
.cartbtn.pop{animation:pop .35s}
.cbadge{position:absolute;top:-5px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;border:2px solid var(--bg);background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:16px;text-align:center}
.cbadge[hidden]{display:none}
.cbadge.pop{animation:pop .4s}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;min-height:44px;white-space:nowrap;padding:2px 16px 0;border-radius:var(--r);
  border:1px solid var(--line);color:var(--muted);text-decoration:none;font:400 15px/1.2 var(--serif);letter-spacing:.06em;
  transition:background .15s,border-color .15s}
.nav a:hover{border-color:var(--muted);color:var(--text)}
.nav a[aria-current="true"]{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- Secciones ---------- */
main{max-width:1160px;margin:0 auto;padding:0 20px}
.cat{padding-top:64px;scroll-margin-top:64px}
.cat:first-of-type{padding-top:56px}
.cat:last-of-type{min-height:calc(100dvh - 140px)}
.cat h2{display:flex;align-items:center;gap:16px;font:400 clamp(36px,9.5vw,44px)/1 var(--serif);letter-spacing:.04em;color:var(--red)}
.cat h2::after{content:"";flex:1;height:1px;background:var(--line)}
.cat .note{margin-top:10px;color:var(--muted);font-size:14px;max-width:60ch}
.list{display:grid;grid-template-columns:1fr;column-gap:56px;margin-top:12px}
@media(min-width:880px){.list{grid-template-columns:1fr 1fr}}

.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;padding:22px 0;border-bottom:1px solid var(--line)}
.item[hidden],.cat[hidden]{display:none!important}
.item h3{font:400 24px/1.05 var(--serif);letter-spacing:.03em}
.item:last-child{border-bottom:0}
@media(min-width:880px){.list .item:nth-last-child(2):nth-child(odd){border-bottom:0}}
.item.nopic{align-items:center;padding:14px 0}
.item.nopic .row2{grid-column:2;grid-row:1;min-height:0}
.hd{grid-column:1;grid-row:1;display:grid;gap:5px;align-content:start;min-width:0}
.row2{min-height:44px;grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.act{margin-left:auto;width:var(--mw)}
.fmt[hidden],.offer[hidden]{display:none!important}
.opts[hidden],.offer[hidden]{display:none}
.offer{flex:1;min-width:0}
.offer.in{animation:fadeSlow .9s ease-out}
.fmt.in{animation:fadeSlow .6s ease-out}
.fmt.out,.offer.out{opacity:0;transition:opacity .28s ease}
@keyframes fadeSlow{from{opacity:0}to{opacity:1}}
.of{display:grid;gap:1px;width:100%;min-height:44px;padding:6px 16px 7px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);text-align:left;transition:border-color .15s}
.of:hover{border-color:var(--muted)}
.of-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.of-h b{font:400 19px/1.05 var(--serif);letter-spacing:.03em}
.of-h i{font-style:normal;font-size:14px;font-weight:600;color:var(--red-hi)}
.of-s{font-size:12px;line-height:1.3;color:var(--muted)}
.desc{margin:0;color:var(--muted);font-size:14px;line-height:1.45;max-width:46ch}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{min-height:44px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:none;color:var(--text);font-size:14px;font-weight:500;transition:border-color .15s,background .15s}
.opts button:hover{border-color:var(--muted)}
.opts button[aria-pressed="true"]{border-color:var(--text);background:rgba(243,237,226,.1)}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pick{grid-column:1 / -1;display:grid;gap:8px}
.pick > .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
.pick > .opts button{width:100%;padding-left:4px;padding-right:4px}
.pk-t{font-size:12px;color:var(--muted)}
.pk-err{margin:0;font-size:12px;color:#ff8a8a}
.pick.shake,.fmt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.media{grid-column:2;grid-row:1;position:relative;width:var(--mw);height:var(--mw);align-self:start}
.media img,.ph{display:block;width:100%;height:100%;object-fit:cover;border-radius:var(--r)}
.ph{border:1px solid var(--line);
  background:repeating-linear-gradient(135deg,#1b1a19 0 10px,#211f1d 10px 20px)}
.add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;padding:0 10px;border:0;border-radius:var(--r);background:var(--red);color:#fff;font-size:14px;font-weight:600;transition:background .18s ease,transform .24s cubic-bezier(.22,.72,.24,1)}
.add .pl{display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1;font-weight:500;transform:translateY(-.5px)}
.add .ap{display:inline-flex;align-items:center;line-height:1}
.add:hover{background:var(--red-hi)}
@media(max-width:380px){
  .row2{gap:6px}
  .opts button{padding:0 9px}
  .of{padding:6px 12px 7px}
}
@media(max-width:340px){
  .opts button{padding:0 6px}
  .row2{gap:4px}
}
.zoom{display:block;width:100%;height:100%;padding:0;border:0;background:none;border-radius:var(--r);cursor:zoom-in}
.stp{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;border-radius:var(--r);background:var(--red);color:#fff}
.stp[hidden],.add[hidden]{display:none}
.stp button{flex:0 0 40px;height:100%;border:0;background:none;color:#fff;font-size:20px;line-height:1}
.stp span{flex:1;text-align:center;font-weight:700;font-size:16px}
.stp.pop{animation:pop .48s cubic-bezier(.22,.72,.24,1)}
.lb{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.96)}
.lb[hidden]{display:none}
.lb figure{display:grid;gap:12px;justify-items:center;text-align:center}
.lb img{display:block;max-width:min(92vw,820px);max-height:76dvh;border-radius:var(--r)}
.lb figcaption{font:400 24px/1.1 var(--serif);letter-spacing:.03em;color:#f3ede2;max-width:46ch}
.lb figcaption small{display:block;margin-top:4px;color:#a39d92;font:400 14px/1.4 var(--sans)}
.lb-x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:var(--r);border:1px solid #3a3836;background:#161514;color:#fff;font-size:20px}
@keyframes pop{0%{transform:scale(.982);opacity:.9}55%{transform:scale(1.012);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes softReveal{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.stp:not([hidden]){animation:softReveal .28s ease-out}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.add:active{transform:scale(.988)}

footer{max-width:1160px;margin:56px auto 0;padding:24px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:grid;gap:6px}
footer b{color:var(--text);font-weight:600}

/* ---------- Bandeja inferior de sugerencias ---------- */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;width:min(560px,calc(100% - 24px));
  transform:translateX(-50%);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none}
.dock.on{display:block}
.suggest{padding:10px 12px;background:#ebe2cf;color:#1c1813}
.suggest[hidden]{display:none}
.suggest.in{animation:rise .5s ease-out}
.suggest.out{opacity:0;transform:translateY(6px);transition:opacity .18s ease,transform .18s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sg-top b{font:400 19px/1.1 var(--serif);letter-spacing:.03em;color:#1c1813}
.sg-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sg-x{flex:none;width:44px;height:44px;margin:-10px -10px -10px 0;border:0;border-radius:var(--r);background:none;color:#5f5545;font-size:15px}
.sg-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sg-add{flex:1 1 auto;white-space:nowrap;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 14px;border-radius:var(--r);border:1px solid #cdbf9f;background:#f7f1e3;color:#1c1813;font-size:14px;font-weight:500;text-align:left}
.sg-add b{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:14px;color:var(--red)}
.sg-add b .pl{font-size:16px;line-height:1;font-weight:500}
.sg-add:hover{border-color:#1c1813}
body.has-sug{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}

/* ---------- Panel del pedido ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:88dvh;display:flex;flex-direction:column;
  background:#141312;border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;
  transform:translateY(105%);transition:transform .25s ease;overflow-y:auto;overscroll-behavior:contain}
.drawer > *{flex-shrink:0}
.drawer.on{transform:none}
@media(min-width:900px){
  .scrim{display:none}
  .drawer{left:auto;top:0;width:420px;max-height:none;border-radius:0;border-top:0;border-bottom:0;transform:translateX(105%)}
  body.panel-open .dock{display:none}
  main,footer{transition:margin .25s}
  body.panel-open main,body.panel-open footer{margin-right:max(20px,calc((100% - 1160px) / 2 + 420px - 20px))}
}
.dh{position:sticky;top:0;z-index:2;background:#141312;display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px}
.dh-main{display:flex;align-items:center;gap:6px;min-width:0}
.dh h2{font:400 24px/1 var(--serif);letter-spacing:.03em}
.head-back{display:grid;place-items:center;width:44px;height:44px;margin-left:-10px;border:0;border-radius:var(--r);background:none;color:var(--text);font-size:22px;line-height:1}
.head-back[hidden]{display:none}
.x{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:none;font-size:20px}
.lines{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 20px;-webkit-overflow-scrolling:touch}
.empty{padding:28px 0;color:var(--muted)}
.line{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line b{font-weight:600}
.line small{display:block;color:var(--muted);font-size:12px}
.line-thumb,.line-thumb-ph{display:block;width:56px;height:56px;border-radius:var(--r);align-self:center}
.line-thumb{object-fit:cover;border:1px solid var(--line);background:#1b1a19}
.line-thumb-ph{border:1px solid var(--line);background:repeating-linear-gradient(135deg,#1b1a19 0 10px,#211f1d 10px 20px)}
.line-content{min-width:0}
.line-name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-detail{margin-top:2px;line-height:1.35;display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line-price{display:flex;align-items:baseline;gap:8px;margin-top:3px;min-width:0}
.line-total{white-space:nowrap}
.line-unit{min-width:0}
.qty{display:flex;align-items:center;gap:8px;flex:0 0 auto;align-self:center}
.qty button{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:none;font-size:18px;line-height:1}
.qty span{min-width:18px;text-align:center;font-weight:600}
.df{margin-top:0;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:10px;background:#141312;flex:0 0 auto}
#checkout1{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.checkout-step[hidden]{display:none!important}
.checkout-step.in{animation:checkoutIn .28s ease-out}
@keyframes checkoutIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.step2-summary{padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:13px;color:var(--muted)}
.next{min-height:48px;border-radius:var(--r);font-weight:600;font-size:15px;border:0;background:var(--red);color:#fff}
.next:hover{background:var(--red-hi)}
#checkout1 .next{position:static;box-shadow:none}
.df label{font-size:12px;color:var(--muted)}
.df input:not([type="radio"]),.df textarea{width:100%;margin-top:4px;padding:12px 13px;border-radius:var(--r);border:2px solid #fff;
  background:#fff;color:#16130f;font:inherit;font-size:16px;resize:vertical}
.df input:not([type="radio"])::placeholder,.df textarea::placeholder{color:#8a8378}
.df input:not([type="radio"]):focus,.df textarea:focus{outline:none;border-color:var(--red)}
.sug{padding:16px 0 8px}
.sug p{font-size:14px;color:var(--text);font-weight:600;margin-bottom:8px}
.sug-list{display:grid;gap:8px}
.sug-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.sug-copy{min-width:0;flex:1;display:grid;gap:2px}
.sug-topline{display:flex;align-items:baseline;gap:7px;min-width:0}
.sug-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500}
.sug-badge{color:var(--red-hi);font-size:12px;font-weight:600;line-height:1.2}
.sug-price{color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.sug-add{width:44px;height:44px;min-width:44px;border-radius:var(--r);border:1px solid var(--line);background:none;color:var(--text);font-size:18px;line-height:1}
.sug-row .sug-add{border-color:var(--red);background:var(--red);color:#fff}
.sug-row .sug-add:hover{background:var(--red-hi)}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:600;padding-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.shake{animation:shake .35s}
.seg label{display:block;margin:0;color:var(--text)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg>label>span{display:grid;grid-template-rows:auto auto;align-items:center;justify-items:center;min-height:44px;text-align:center;padding:9px 8px;border-radius:var(--r);border:1px solid var(--line);font-size:14px;font-weight:500;cursor:pointer}
.seg-main{grid-row:1}
.seg-sub{grid-row:2;color:var(--muted);font-size:12px;font-weight:400;line-height:1.25}
.seg input:checked + span{border-color:var(--text);background:rgba(243,237,226,.06)}
.seg input:focus-visible + span{outline:2px solid var(--text);outline-offset:2px}
.delivery-err{color:#ff8a8a;font-size:12px;min-height:0;margin:0}
.delivery-err:empty{display:none}
.err{color:#ff8a8a;font-size:12px;min-height:0}
.err:empty{display:none}
.hint{font-size:12px;color:var(--muted)}
  .dnote{margin:-4px 0 0;font-size:12px;color:var(--muted)}
.dnote[hidden]{display:none}
.checkout-info,.wa-hint{font-size:12px;line-height:1.45;color:var(--muted)}
.wa-fallback{font-size:12px;color:var(--text);text-underline-offset:2px;min-height:44px;display:flex;align-items:center}
.wa-fallback[hidden]{display:none}
.note-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0;border:0;background:none;color:var(--text);font:inherit;font-size:14px;text-align:left}
.note-toggle span{color:var(--muted);font-size:18px;transition:transform .15s}
.note-toggle[aria-expanded="true"] span{transform:rotate(45deg)}
.note-wrap[hidden]{display:none}
.addr-block{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--r);background:rgba(246,180,0,.10);border:1px solid rgba(246,180,0,.30)}
.steps{margin:0 0 0 18px;padding:0;display:grid;gap:2px;font-size:12px;color:var(--muted)}
.pay{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:12px}
.pay[hidden]{display:none}
.pay-t{margin-bottom:6px;font-size:14px}
.pay-t b{color:var(--red-hi)}
#payRows div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
#payRows span{color:var(--muted)}
#payRows b{font-weight:500;text-align:right}
.copy{margin-top:8px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:none;font-size:14px}
.send{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 14px #141312;padding:15px;border:0;border-radius:var(--r);background:var(--red);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.send svg{width:20px;height:20px;flex:none}
.send:hover{background:var(--red-hi)}
.send:disabled{opacity:.45;cursor:not-allowed}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}

/* ---------- Combo: etiqueta sobre la foto, interruptor y hoja ---------- */

/* Banner / carrusel */
.mafia-hero{
  width:min(1160px,calc(100% - 32px));
  margin:0 auto 18px;
  position:relative;
}
.mafia-slider{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--surface);
  box-shadow:0 14px 38px rgba(0,0,0,.28);
}
.mafia-track{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.mafia-track::-webkit-scrollbar{display:none}
.mafia-slide{
  position:relative;
  flex:0 0 100%;
  aspect-ratio:2.55/1;
  min-height:150px;
  scroll-snap-align:start;
  overflow:hidden;
  background:#151412;
}
.mafia-slide img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
}
.mafia-slide::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.56),rgba(0,0,0,.08) 62%,rgba(0,0,0,.04));
}
.mafia-slide-copy{
  position:absolute;left:clamp(18px,4vw,42px);top:50%;z-index:2;
  transform:translateY(-50%);max-width:54%;
}
.mafia-slide-kicker{
  display:block;margin-bottom:5px;color:#fff;font:400 14px/1 var(--serif);
  letter-spacing:.12em;text-transform:uppercase;opacity:.88
}
.mafia-slide-title{
  display:block;color:#fff;font:400 clamp(30px,5vw,58px)/.92 var(--serif);
  text-shadow:0 2px 16px rgba(0,0,0,.35)
}
.mafia-slide-sub{
  display:block;margin-top:9px;color:rgba(255,255,255,.86);font-size:13px;line-height:1.35
}
.mafia-dots{
  display:flex;justify-content:center;gap:6px;margin-top:9px
}
.mafia-dots button{
  width:8px;height:8px;padding:0;border:0;border-radius:99px;background:#4b4742;
  transition:width .2s,background .2s
}
.mafia-dots button.on{width:24px;background:var(--red)}
.mafia-arr{
  position:absolute;top:50%;z-index:3;transform:translateY(-50%);
  width:42px;height:42px;padding:0;border:1px solid rgba(255,255,255,.15);
  border-radius:50%;background:rgba(12,12,12,.68);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;font-size:0;line-height:1;
  backdrop-filter:blur(7px)
}
.mafia-arr::before{
  content:"";display:block;width:10px;height:10px;
  border-top:2.5px solid currentColor;border-right:2.5px solid currentColor;
}
.mafia-arr.prev::before{transform:translateX(2px) rotate(-135deg)}
.mafia-arr.next::before{transform:translateX(-2px) rotate(45deg)}
.mafia-arr.prev{left:10px}.mafia-arr.next{right:10px}
@media(max-width:640px){
  .mafia-hero{width:calc(100% - 24px);margin-bottom:8px}
  .mafia-slide{aspect-ratio:1.75/1;min-height:190px}
  .mafia-slide-copy{max-width:62%;left:18px}
  .mafia-slide-title{font-size:34px}
  .mafia-arr{display:none}
}

/* Popup promocional */
.mafia-pop{
  position:fixed;inset:0;z-index:180;display:grid;place-items:center;padding:18px;
  background:rgba(0,0,0,.66);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
  opacity:0;pointer-events:none;transition:opacity .25s ease
}
.mafia-pop.on{opacity:1;pointer-events:auto}
.mafia-pop-card{
  position:relative;width:min(440px,92vw);overflow:hidden;border:1px solid var(--line);
  border-radius:24px;background:var(--surface);box-shadow:0 30px 80px rgba(0,0,0,.58);
  transform:translateY(16px) scale(.97);transition:transform .32s cubic-bezier(.2,1.1,.4,1)
}
.mafia-pop.on .mafia-pop-card{transform:none}
.mafia-pop-card img{display:block;width:100%;height:auto;max-height:70dvh;object-fit:cover}
.mafia-pop-x{
  position:absolute;top:12px;right:12px;z-index:2;width:42px;height:42px;border:0;border-radius:50%;
  background:rgba(12,12,12,.72);color:#fff;font-size:23px;display:grid;place-items:center
}
.mafia-pop-info{padding:16px 18px 18px}
.mafia-pop-info b{display:block;font:400 28px/1 var(--serif)}
.mafia-pop-info span{display:block;margin-top:6px;color:var(--muted);font-size:13px}

<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "$" + new Intl.NumberFormat("es-CL").format(n);
const reduced = window.matchMedia("(prefers-reduced-motion:reduce)").matches;

/* Fuente de la carta: menu-data.js (la misma de la carta online) + cambios del local */
let LOCAL = { disabledProducts: LOCAL_DEFAULTS.disabledProducts, overrides: LOCAL_DEFAULTS.overrides, notes: LOCAL_DEFAULTS.notes };
let sig = "";

function photoOf(it, ov){
  if (ov && typeof ov.img === "string") return ov.img;
  if (it.img) return it.img;
  return it.foto ? "/fotos/" + it.foto + ".webp" : "";
}
function cardHTML(it, compact, eager){
  const ov = LOCAL.overrides[it.id] || {};
  const name = ov.name || it.name, desc = ov.desc != null ? ov.desc : (it.desc || "");
  const price = ov.price != null ? ov.price : it.price;
  const src = photoOf(it, ov);
  const media = src
    ? '<button class="zoom" type="button" data-zoom="' + esc(src) + '" aria-label="Ver foto de ' + esc(name) + '"><img class="dish" src="' + esc(src) + '" alt="" loading="' + (eager ? "eager" : "lazy") + '" decoding="async"></button>'
    : '<div class="ph" aria-hidden="true"></div>';
  const since = it.priceByPick && ov.price == null ? "<small>Desde</small>" : "";
  return '<article class="item' + (compact ? " nopic" : "") + '" data-id="' + esc(it.id) + '">' +
    '<div class="hd"><h3>' + esc(name) + '</h3>' + (desc ? '<p class="desc">' + esc(desc) + '</p>' : "") + '</div>' +
    (compact ? "" : '<div class="media">' + media + '</div>') +
    '<div class="row2"><div class="act"><span class="vprice">' + since + fmt(price) + '</span></div></div></article>';
}
function cats(){
  const off = new Set(LOCAL.disabledProducts);
  return MENU.filter(c => !c.hidden).map(c => ({ c, items: c.items.filter(i => !off.has(i.id)) })).filter(x => x.items.length);
}
function draw(){
  const list = cats();
  const next = JSON.stringify([list.map(x => x.c.id + ":" + x.items.map(i => i.id)), LOCAL.overrides, LOCAL.notes]);
  if (next === sig) return; sig = next;
  $("#nav").innerHTML = list.map(x => '<li><a href="#' + x.c.id + '">' + esc(x.c.name) + '</a></li>').join("");
  $("#menu").innerHTML = list.map((x, ci) => {
    const c = x.c, note = c.id in LOCAL.notes ? LOCAL.notes[c.id] : (c.note || "");
    return '<section class="cat' + (c.compact ? " compact" : "") + '" id="' + c.id + '" aria-labelledby="h-' + c.id + '"><h2 id="h-' + c.id + '">' + esc(c.name) + '</h2>' +
      (note ? '<p class="note">' + esc(note) + '</p>' : "") +
      '<div class="list">' + x.items.map(i => cardHTML(i, c.compact, ci === 0)).join("") + '</div></section>';
  }).join("");
  bindNav();
}
$("#foot").innerHTML = "<p><b>MAFIA</b> · Genaro Gallo 2955, Local 2</p><p>Instagram: Mafi4.cl</p>";

/* ---------- navegación ---------- */
const navEl = $(".nav"), navUl = $("#nav");
let activeId = null, lock = false, lockTimer, ticking = false;
function setActive(id){
  activeId = id;
  navUl.querySelectorAll("a").forEach(a => {
    const on = a.getAttribute("href") === "#" + id;
    on ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current");
    if (on && navUl.scrollWidth > navUl.clientWidth) navUl.scrollTo({ left: a.offsetLeft - (navUl.clientWidth - a.offsetWidth) / 2, behavior: reduced ? "auto" : "smooth" });
  });
}
function scrollToCat(id){
  const h = document.getElementById("h-" + id); if (!h) return;
  window.scrollTo({ top: Math.max(0, h.getBoundingClientRect().top + window.scrollY - navEl.offsetHeight - 16), behavior: reduced ? "auto" : "smooth" });
}
function bindNav(){ const f = navUl.querySelector("a"); if (f) setActive(f.getAttribute("href").slice(1)); }
navUl.addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return; e.preventDefault();
  const id = a.getAttribute("href").slice(1); lock = true; setActive(id); scrollToCat(id);
  clearTimeout(lockTimer); lockTimer = setTimeout(() => { lock = false; spy(); }, 900);
});
function spy(){
  ticking = false; if (lock) return;
  const hs = [...document.querySelectorAll(".cat h2")]; if (!hs.length) return;
  const limit = navEl.offsetHeight + 80; let cur = hs[0].id.slice(2);
  for (const h of hs) if (h.getBoundingClientRect().top <= limit) cur = h.id.slice(2);
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = hs[hs.length - 1].id.slice(2);
  if (cur !== activeId) setActive(cur);
}
window.addEventListener("scroll", () => { if (!ticking){ ticking = true; requestAnimationFrame(spy); } }, { passive:true });
window.addEventListener("resize", spy);

/* ---------- foto ampliada ---------- */
const zov = $("#zov");
document.addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]"); if (z){ $("#zi").src = z.dataset.zoom; zov.hidden = false; return; }
  if (e.target === zov || e.target.closest("#zx")) zov.hidden = true;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") zov.hidden = true; });

draw();
fetch("/.netlify/functions/local-menu?t=" + Date.now(), { cache:"no-store" })
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d && Array.isArray(d.disabledProducts)){ LOCAL = { disabledProducts:d.disabledProducts, overrides:d.overrides || {}, notes:d.notes || {} }; draw(); } })
  .catch(() => {});
