<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MAFIA · Pedidos</title>
<link rel="icon" href="/favicon.png">
<style>
:root{--bg:#0d0c0b;--panel:#141311;--line:#262320;--text:#f3ede2;--muted:#9d968a;--amber:#e8ae2f;--green:#35b274;--red:#d4122f}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:inherit}

/* acceso */
.login{max-width:340px;margin:18vh auto 0;padding:0 20px;display:grid;gap:14px}
.login h1{margin:0 0 6px;font-size:22px;font-weight:600}
.login input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;color:#111;padding:0 14px;font-size:16px}
.login button{height:50px;border:0;border-radius:12px;background:var(--text);color:#141312;font-weight:700}
.login p{margin:0;min-height:18px;font-size:13px;color:#ff8b9a}

/* estructura */
.app{display:grid;grid-template-columns:minmax(320px,400px) 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:100vh}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
.bar h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.01em}
.icons{display:flex;gap:4px}
.ib{height:40px;min-width:40px;padding:0 10px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:13px}
.ib[aria-pressed="true"]{color:var(--green)}
.ib:hover{background:#1c1a17}
.tabs{display:flex;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:none;height:42px;border:0;background:none;color:var(--muted);font-size:14px;position:relative;padding:0}
.tab[aria-pressed="true"]{color:var(--text);font-weight:600}
.tab[aria-pressed="true"]:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--text)}
.tab i{font-style:normal;margin-left:5px;color:var(--muted);font-weight:400}
.tab.hot i{color:var(--amber);font-weight:700}
.alert{display:flex;align-items:center;gap:10px;margin:12px 18px 0;padding:12px 14px;border-radius:12px;background:#2a2010;color:#ffd98a;font-size:14px;font-weight:600}
.alert .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.enable{margin:12px 18px 0;height:44px;border:1px dashed #4a4439;border-radius:12px;background:none;color:var(--muted);font-size:13px}

.list{flex:1;overflow-y:auto;padding:6px 0 30px}
.row{display:grid;grid-template-columns:1fr auto;gap:1px 12px;width:100%;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.row:hover{background:#171513}
.row[aria-current="true"]{background:#1b1916}
.row .n{font-size:16px;font-weight:700}
.row .t{font-size:16px;font-weight:600;text-align:right}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .w{font-size:13px;color:var(--muted);text-align:right}
.row.new .n:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:9px;vertical-align:2px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}

.detail{padding:14px 16px 24px;max-width:560px;width:100%}
.none{display:grid;place-items:center;height:60vh;color:var(--muted);font-size:14px}
.back{display:none;height:36px;margin:0 0 6px -8px;padding:0 8px;border:0;background:none;color:var(--muted);font-size:14px}
.d-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d-num{font-size:30px;font-weight:800;line-height:1;margin-right:2px}
.chip{padding:5px 10px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.chip.paid{background:#16482f;color:#6ff0ae}
.chip.del{background:var(--amber);color:#2a1d00}
.chip.ret{background:#dfe9ff;color:#14233f}
.d-time{margin-left:auto;color:var(--muted);font-size:13px}
.cust{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;background:var(--panel);border:1px solid #34302a;border-radius:12px}
.cust .cn{flex:1;min-width:0}
.cust b{display:block;font-size:16px;font-weight:700}
.cust span{display:block;margin-top:2px;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:none;height:38px;padding:0 14px;display:inline-flex;align-items:center;border:1px solid #4a4439;border-radius:10px;background:#1f1c18;color:var(--text);font-size:14px;font-weight:600;text-decoration:none}
.addr{margin-top:8px;padding:9px 12px;border-radius:10px;background:#2a2010;color:#ffd98a;font-size:14px;font-weight:600;line-height:1.35}
.card{margin-top:12px;background:#efe7d6;color:#17140f;border-radius:12px;padding:4px 14px}
.it{display:grid;grid-template-columns:30px 1fr auto;gap:6px;align-items:baseline;padding:10px 0;border-bottom:1px solid #d6ccb6}
.it .q{font-weight:800;font-size:16px}
.it .nm{font-size:15px;font-weight:700}
.it small{display:block;margin-top:2px;color:#5d5546;font-size:13px;line-height:1.35;font-weight:500}
.it .p{font-size:14px;font-weight:600}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 8px}
.tot span{font-size:13px;color:#5d5546;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tot b{font-size:22px;font-weight:800}
.tot small{display:block;font-size:12px;color:#5d5546;font-weight:500;text-align:right}
.note{margin-top:10px;padding:9px 12px;border-radius:10px;background:#3a2c0a;color:#ffe3a0;font-size:14px;line-height:1.4}
.note small{display:block;color:var(--amber);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.warn{margin-top:10px;padding:10px 12px;border-radius:10px;background:#3a1218;color:#ffc9d0;font-size:13px}
.actions{position:sticky;bottom:0;margin:12px -16px -24px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.hint{margin:0 0 8px;color:var(--amber);font-size:13px;font-weight:600;text-align:center}
.go{display:block;width:100%;height:54px;border:0;border-radius:12px;background:var(--text);color:#141312;font-size:17px;font-weight:800;letter-spacing:.01em}
.go.accept{background:var(--amber);color:#2a1d00}
.go.ready{background:var(--green);color:#04170d}
.sec{display:flex;gap:8px;margin-top:8px}
.sec>*{flex:1;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.wbtn{border:2px solid var(--green);background:none;color:#6ff0ae}
.sec .ghost{border:1px solid #4a4439;background:#1f1c18;color:var(--text);font-weight:600}
.wbox{margin-top:12px}
.wbox h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wbox textarea{display:block;width:100%;min-height:150px;padding:12px;border:1px solid #34302a;border-radius:12px;background:var(--panel);color:var(--text);font:inherit;font-size:14px;line-height:1.45;resize:vertical}
.wrow{display:flex;gap:8px;margin-top:8px}
.wrow button{flex:1;height:46px;border:0;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}
.wcopy{background:var(--green);color:#04170d}
.wphone{background:#2a2622;color:var(--text);font-weight:600!important}
details{margin-top:14px;color:var(--muted);font-size:12px}
details summary{cursor:pointer;min-height:30px;display:flex;align-items:center}
details code{display:block;margin-top:4px;word-break:break-all;color:var(--text);font-size:12px}
.msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3a1218;color:#ffc9d0;padding:10px 16px;border-radius:999px;font-size:13px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{border-right:0}
  .detail{display:none}
  .app.open .side{display:none}
  .app.open .detail{display:block;padding-top:8px}
  .back{display:inline-flex;align-items:center}
}
@media print{body{background:#fff;color:#000}.side,.back,.actions,.msg,details{display:none!important}.app{display:block}.detail{display:block!important;color:#000}.d-time,.it small,.who .m,.tot,.it .p{color:#333}.block{border-color:#bbb}}
</style>
</head>
<body>
<main class="loginwrap" id="loginwrap"><form class="login" id="login" autocomplete="off">
  <h1>Pedidos MAFIA</h1>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Clave" aria-label="Clave de administrador" required>
  <button type="submit">Entrar</button>
  <p id="loginMsg" role="alert"></p>
</form></main>

<div class="app" id="app" hidden>
  <section class="side" aria-label="Lista de pedidos">
    <div class="bar">
      <h1>Pedidos</h1>
      <div class="icons">
        <button class="ib" id="sound" type="button" aria-pressed="false" aria-label="Alertas de sonido">🔔 Sonido</button>
        <button class="ib" id="logout" type="button">Salir</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="alert" id="alert" hidden><span class="dot"></span><span id="alertTxt"></span></div>
    <button class="enable" id="enable" type="button" hidden>Toca para activar el sonido de alerta</button>
    <div class="list" id="list"></div>
  </section>
  <main class="detail" id="detail" aria-live="polite"></main>
</div>
<div class="msg" id="msg" role="alert" hidden></div>

<script>
const FN = "/.netlify/functions/";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "$" + new Intl.NumberFormat("es-CL").format(n);
const hhmm = d => new Date(d).toLocaleTimeString("es-CL", { hour:"2-digit", minute:"2-digit" });
const day = d => new Date(d).toLocaleDateString("es-CL", { day:"numeric", month:"short" });
const STATES = ["nuevo", "preparacion", "listo", "entregado"];
const TAB = { nuevo:"Nuevos", preparacion:"Preparación", listo:"Listos", entregado:"Entregados" };
const NEXT = { nuevo:["preparacion", "Aceptar pedido", "accept"], preparacion:["listo", "Marcar listo"], listo:["entregado", "Marcar entregado"] };
let pw = "", orders = [], tab = "nuevo", sel = null, timer = null, alarm = null, soundOn = false, ctx = null, lock = null, known = null, flash = null;
try { pw = sessionStorage.getItem("mafia_caja_pw") || ""; } catch(e){}

async function api(name, body){
  const r = await fetch(FN + name, { method:"POST", cache:"no-store", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ password:pw, ...body }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || "Sin conexión"), { status:r.status });
  return d;
}
const toast = t => { const m = $("#msg"); m.textContent = t; m.hidden = !t; if (t) setTimeout(() => m.hidden = true, 3500); };

/* ---- sonido y pantalla encendida ---- */
function audioReady(){ try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); return ctx.state !== "closed"; } catch(e){ return false; } }
function ring(){
  if (!soundOn || !audioReady()) return;
  [880, 1175, 1480].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime + i * .2; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.start(t); o.stop(t + .19); });
}
async function keepAwake(){ try { if (navigator.wakeLock && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch(e){} }
function setSound(on){ soundOn = on; if (on){ audioReady(); keepAwake(); } $("#sound").setAttribute("aria-pressed", on); $("#sound").textContent = on ? "🔔 Sonido activo" : "🔕 Sonido apagado"; $("#enable").hidden = on || !pw; syncAlarm(); }

/* mientras haya pedidos sin aceptar: alerta visible, título parpadeando y sonido cada pocos segundos */
function pending(){ return orders.filter(o => o.kitchen_status === "nuevo"); }
function syncAlarm(){
  const n = pending().length;
  $("#alert").hidden = !n; $("#alertTxt").textContent = n === 1 ? "1 pedido por aceptar" : n + " pedidos por aceptar";
  clearInterval(alarm); clearInterval(flash);
  if (n){
    if (soundOn){ ring(); alarm = setInterval(ring, 5000); }
    let on = false; flash = setInterval(() => { on = !on; document.title = on ? `(${n}) ¡Pedido nuevo!` : "MAFIA · Pedidos"; }, 1000);
  } else document.title = "MAFIA · Pedidos";
}

/* ---- datos ---- */
async function load(){
  try {
    const d = await api("orders-list", { days:3 });
    const prev = known; orders = d.orders;
    const fresh = prev ? orders.filter(o => !prev.has(o.reference)) : [];
    known = new Set(orders.map(o => o.reference));
    if (fresh.length) tab = "nuevo";
    draw(); syncAlarm();
  } catch(e){
    if (e.status === 401){ logout(); $("#loginMsg").textContent = "Clave incorrecta"; return; }
    toast("Sin conexión, reintentando…");
  }
}
const inTab = s => orders.filter(o => o.kitchen_status === s).sort((a, b) => s === "entregado" ? b.paid_at.localeCompare(a.paid_at) : a.paid_at.localeCompare(b.paid_at));

function draw(){
  $("#tabs").innerHTML = STATES.map(s => { const n = inTab(s).length; return `<button class="tab${s === "nuevo" && n ? " hot" : ""}" type="button" data-tab="${s}" aria-pressed="${tab === s}">${TAB[s]}<i>${n}</i></button>`; }).join("");
  const list = inTab(tab);
  $("#list").innerHTML = list.length ? list.map(o => `<button class="row${o.kitchen_status === "nuevo" ? " new" : ""}" type="button" data-ref="${esc(o.reference)}" aria-current="${sel === o.reference}">
      <span class="n">#${esc(o.short_code)}</span><span class="t">${fmt(o.paid_total ?? o.total)}</span>
      <span class="s">${esc(o.customer.name)} · ${o.delivery_type === "delivery" ? "Delivery" : "Retiro"}</span><span class="w">${hhmm(o.paid_at)}</span></button>`).join("") : `<p class="empty">Sin pedidos en “${TAB[tab]}”.</p>`;
  drawDetail();
}
const waNum = p => { let d = String(p || "").replace(/\D/g, ""); if (d.length === 9 && d[0] === "9") d = "56" + d; return d; };

let msgOpen = null;                                  /* referencia del pedido con el mensaje abierto */
function clientMsg(o){
  const c = o.customer || {}, del = o.delivery_type === "delivery", st = o.kitchen_status, name = (c.name || "").trim().split(/\s+/)[0] || "";
  const items = o.items.map(i => `• ${i.quantity}× ${i.name}${i.detail && i.detail.length ? " (" + i.detail.join(", ") + ")" : ""}`).join("\n");
  const resumen = `Pedido #${o.short_code}\n${items}\nTotal pagado: ${fmt(o.paid_total ?? o.total)}`;
  const hola = `Hola ${name}, `;
  if (st === "entregado") return `${hola}confirmamos la entrega de tu pedido #${o.short_code}. ¡Gracias por pedir en MAFIA! Si hubo algún problema con tu pedido, respóndenos por aquí y lo resolvemos.`;
  if (st === "listo") return del
    ? `${hola}tu pedido está listo y acaba de salir del local hacia ${o.address}${c.unit ? " (" + c.unit + ")" : ""}.\n\n${resumen}\n\nPor favor confírmanos por este mismo chat cuando lo recibas. ¡Gracias por pedir en MAFIA!`
    : `${hola}tu pedido está listo para retirar en el local.\n\n${resumen}\n\nTe esperamos. ¡Gracias por pedir en MAFIA!`;
  return `${hola}recibimos tu pedido y ya lo estamos preparando.\n\n${resumen}\n\nTe avisamos por aquí apenas ${del ? "salga del local" : "esté listo para retirar"}. ¡Gracias por pedir en MAFIA!`;
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){ const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch(_){} ta.remove(); return ok; }
}
function drawDetail(){
  const o = orders.find(x => x.reference === sel), box = $("#detail"), app = $("#app");
  if (!o){ app.classList.remove("open"); box.innerHTML = '<p class="none">Elige un pedido para ver el detalle</p>'; return; }
  const c = o.customer || {}, del = o.delivery_type === "delivery", nx = NEXT[o.kitchen_status], prev = STATES[STATES.indexOf(o.kitchen_status) - 1];
  const canMsg = !!c.phone && o.kitchen_status !== "nuevo", showMsg = canMsg && msgOpen === o.reference;
  const tcls = nx ? (nx[2] || (nx[0] === "listo" ? "ready" : "")) : "";
  box.innerHTML = `
    <button class="back" id="back" type="button">← Pedidos</button>
    <div class="d-head"><span class="d-num">#${esc(o.short_code)}</span><span class="chip paid">✓ Pagado</span><span class="chip ${del ? "del" : "ret"}">${del ? "Delivery" : "Retiro"}</span><span class="d-time">${day(o.paid_at)} · ${hhmm(o.paid_at)}</span></div>
    <div class="cust"><div class="cn"><b>${esc(c.name)}</b>${c.phone ? `<span>${esc(c.phone)}</span>` : ""}</div>${c.phone ? `<a class="pill" href="tel:${esc(c.phone)}">Llamar</a>` : ""}</div>
    ${del ? `<div class="addr">📍 ${esc(o.address)}${c.unit ? " · " + esc(c.unit) : ""}</div>` : ""}
    ${c.notes ? `<div class="note"><small>Observaciones</small>${esc(c.notes)}</div>` : ""}
    <div class="card">${o.items.map(i => `<div class="it"><span class="q">${i.quantity}×</span><div class="nm">${esc(i.name)}${i.detail && i.detail.length ? `<small>${i.detail.map(esc).join(" · ")}</small>` : ""}</div><span class="p">${fmt(i.total_amount)}</span></div>`).join("")}
      <div class="tot"><span>Total pagado</span><div><b>${fmt(o.paid_total ?? o.total)}</b>${del ? `<small>incluye delivery ${fmt(o.delivery_fee)}</small>` : ""}</div></div></div>
    ${o.duplicate_payments.length ? `<div class="warn">Posible doble cobro en Mercado Pago. Revisa y devuelve si corresponde.</div>` : ""}
    ${showMsg ? `<div class="wbox"><h3>Mensaje para el cliente</h3><textarea id="wtext" aria-label="Mensaje para el cliente">${esc(clientMsg(o))}</textarea><div class="wrow"><button type="button" class="wcopy" id="wcopy">Copiar mensaje</button><button type="button" class="wphone" id="wphone" data-phone="${esc(waNum(c.phone))}">Copiar teléfono</button></div></div>` : ""}
    <details><summary>Datos de pago</summary><code>Pedido: ${esc(o.reference)}</code><code>Mercado Pago: ${esc(o.mp_order_id || "—")}</code>${o.accepted_at ? `<code>Aceptado: ${hhmm(o.accepted_at)}</code>` : ""}</details>
    <div class="actions">
      ${o.kitchen_status === "nuevo" ? `<p class="hint">Ingrésalo en Fudo y luego acepta</p>` : ""}
      ${nx ? `<button class="go ${tcls}" id="go" type="button" data-to="${nx[0]}">${nx[1]}</button>` : ""}
      <div class="sec">
        ${canMsg && !showMsg ? `<button type="button" class="wbtn" id="wgen">Mensaje WhatsApp</button>` : ""}
        ${prev ? `<button type="button" class="ghost" id="undo" data-to="${prev}">← ${TAB[prev]}</button>` : ""}
      </div>
    </div>`;
  app.classList.add("open");
}
async function move(to){
  const o = orders.find(x => x.reference === sel); if (!o) return;
  try { await api("orders-update", { reference:o.reference, kitchen_status:to }); o.kitchen_status = to; if (to !== "nuevo" && !o.accepted_at) o.accepted_at = new Date().toISOString(); tab = to; if (to === "listo" || to === "entregado"){ msgOpen = o.reference; } else { sel = null; } draw(); syncAlarm(); }
  catch(e){ toast(e.message); }
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b){ tab = b.dataset.tab; sel = null; draw(); } });
$("#list").addEventListener("click", e => { const r = e.target.closest("[data-ref]"); if (r){ sel = r.dataset.ref; draw(); window.scrollTo(0, 0); } });
$("#detail").addEventListener("click", e => {
  if (e.target.closest("#back")){ sel = null; draw(); return; }
  if (e.target.closest("#wgen")){ msgOpen = sel; drawDetail(); return; }
  if (e.target.closest("#wcopy")){ copyText($("#wtext").value).then(ok => toast(ok ? "Mensaje copiado" : "No se pudo copiar: selecciónalo y usa Ctrl+C")); return; }
  const wp = e.target.closest("#wphone"); if (wp){ copyText(wp.dataset.phone).then(ok => toast(ok ? "Teléfono copiado" : "No se pudo copiar")); return; }
  const b = e.target.closest("[data-to]"); if (b) move(b.dataset.to);
});
$("#sound").addEventListener("click", () => setSound(!soundOn));
$("#enable").addEventListener("click", () => setSound(true));

function start(){ $("#loginwrap").hidden = true; $("#app").hidden = false; drawDetail(); load(); clearInterval(timer); timer = setInterval(load, 7000); }
function logout(){ pw = ""; try { sessionStorage.removeItem("mafia_caja_pw"); } catch(e){} clearInterval(timer); clearInterval(alarm); clearInterval(flash); document.title = "MAFIA · Pedidos"; orders = []; known = null; sel = null; setSound(false); $("#app").hidden = true; $("#loginwrap").hidden = false; $("#pw").value = ""; $("#enable").hidden = true; }
$("#login").addEventListener("submit", async e => {
  e.preventDefault(); pw = $("#pw").value; $("#loginMsg").textContent = "";
  audioReady();                                     /* el toque de "Entrar" permite activar el sonido */
  try { await api("orders-list", { days:1 }); try { sessionStorage.setItem("mafia_caja_pw", pw); } catch(e){} start(); setSound(true); }
  catch(err){ $("#loginMsg").textContent = err.status === 401 ? "Clave incorrecta" : err.message; pw = ""; }
});
$("#logout").addEventListener("click", logout);
document.addEventListener("visibilitychange", () => { if (!document.hidden && pw){ load(); if (soundOn) keepAwake(); } });
if (pw) { start(); $("#enable").hidden = false; }
</script>
</body>
</html>
