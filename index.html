<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c0c">
<title>MAFIA · Admin</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pesto Mafio";src:url("/PestoMafio.ttf") format("truetype"),url("/fonts/PestoMafio.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
:root{--bg:#0c0c0c;--s1:#151413;--s2:#1c1a18;--line:#2a2826;--text:#f3ede2;--muted:#a39d92;--red:#c8102e;--red2:#e0213f;--green:#35b274;--amber:#e8ae2f;--r:18px;--disp:"Pesto Mafio","Playfair Display",Georgia,serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg)}
button,input{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:.04em}

/* acceso */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:min(360px,100%);display:grid;gap:12px;text-align:center}
.login img{width:200px;max-width:70%;margin:0 auto 10px}
.login h1{margin:0 0 6px;font-size:28px}
.login input{height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;color:#111;padding:0 16px;font-size:16px}
.login .btn{height:52px}
.err{min-height:18px;margin:0;color:#ff8b9a;font-size:13px}
.btn{border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:700;font-size:16px;padding:0 20px;min-height:48px}
.btn:hover{background:var(--red2)}.btn:disabled{opacity:.45}

/* estructura */
.shell{min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;height:60px;padding:0 10px;background:rgba(12,12,12,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ico{width:46px;height:46px;display:grid;place-items:center;border:0;background:none;border-radius:12px;color:var(--text)}
.ico:hover{background:var(--s2)}
.top h1{margin:0;flex:1;font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .carta{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.2s}
.drawer{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--s1);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .22s;display:flex;flex-direction:column;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
.menu-open .drawer{transform:none}.menu-open .scrim{opacity:1;pointer-events:auto}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 18px}
.dhead img{height:34px;width:auto}
.nav{display:grid;gap:4px}
.nav a,.nav button{display:flex;align-items:center;gap:14px;width:100%;min-height:50px;padding:0 14px;border:0;border-radius:14px;background:none;color:var(--muted);font-size:16px;font-weight:600;text-align:left}
.nav a:hover,.nav button:hover{background:var(--s2);color:var(--text)}
.nav .on{background:var(--red);color:#fff}
.nav .sep{height:1px;background:var(--line);margin:10px 6px}
.nav .badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--amber);color:#2a1d00;font-size:12px;font-weight:800;display:grid;place-items:center}
.nav .on .badge{background:#fff;color:var(--red)}
.foot{margin-top:auto}

main{padding:22px 16px 110px;max-width:920px;margin:0 auto}
.hello{margin:4px 0 18px}.hello h2{margin:0;font-size:34px;line-height:1.05}.hello p{margin:6px 0 0;color:var(--muted);font-size:14px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:30px;line-height:1;letter-spacing:.02em}
.stat span{display:block;margin-top:6px;font-size:12px;color:var(--muted);line-height:1.25}
.stat.hot b{color:var(--amber)}.stat.ok b{color:var(--green)}.stat.bad b{color:#ff8b9a}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:150px;padding:16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);text-align:left;color:var(--text);transition:transform .12s,border-color .12s,background .12s}
.card:hover{border-color:#4a4642;background:var(--s2)}.card:active{transform:scale(.985)}
.card .ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s2);color:var(--text)}
.card h3{margin:0;font-family:var(--disp);font-weight:400;font-size:22px;letter-spacing:.04em;line-height:1.05}
.card p{margin:5px 0 0;font-size:13px;color:var(--muted);line-height:1.3}
.card.main{background:var(--red);border-color:var(--red)}.card.main:hover{background:var(--red2)}
.card.main .ci{background:rgba(255,255,255,.16);color:#fff}.card.main p{color:rgba(255,255,255,.85)}
.card .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.card .dot.on{background:var(--green)}.card .dot.off{background:#ff8b9a}
.card .tag{position:absolute;top:14px;right:14px;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--amber);color:#2a1d00;font-size:13px;font-weight:800;display:grid;place-items:center}
.card.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}

.view-h{margin:0 0 16px}.view-h p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}

/* productos */
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.search input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--s1);padding:0 14px 0 44px;font-size:16px}
.search input:focus{outline:2px solid var(--red);outline-offset:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--s1);color:var(--muted);font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:#141312}
.chip.warn[aria-pressed=true]{background:#ff8b9a;border-color:#ff8b9a}
.cat{margin:18px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.tile.off{border-color:#6a2433}
.ph{position:relative;aspect-ratio:4/3;background:var(--s2);cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent}
.ph .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:38px;color:#5b554d}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .2s}
.tile.off .ph img{filter:grayscale(1) brightness(.4)}
.sold{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);padding:6px 14px;border-radius:8px;background:var(--red);color:#fff;font-family:var(--disp);font-size:20px;letter-spacing:.06em;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 12px;flex:1}
.tb b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.state{display:block;margin-top:2px;font-size:12px;font-weight:600;color:var(--green)}
.state.off{color:#ff8b9a}
.subs{border-top:1px solid var(--line);background:#121110}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:4px 8px 4px 12px}
.prow span{font-size:14px;color:var(--muted)}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.tiles{grid-template-columns:repeat(4,1fr)}}
.sw{position:relative;display:block;flex:none;width:58px;height:44px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;left:0;top:8px;width:58px;height:28px;border-radius:999px;background:#2b2724;border:1px solid var(--line);transition:.18s;pointer-events:none}
.sw i:after{content:"";position:absolute;left:4px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.18s}
.sw input:checked+i{background:rgba(53,178,116,.25);border-color:var(--green)}
.sw input:checked+i:after{transform:translateX(30px);background:var(--green)}
.sw input:focus-visible+i{outline:2px solid var(--text);outline-offset:2px}
.sw input:disabled+i{opacity:.4}
.none{padding:40px 10px;text-align:center;color:var(--muted);font-size:14px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(21,20,19,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.savebar span{flex:1;font-size:14px;color:var(--amber);font-weight:600}
.savebar .btn{min-width:150px}

/* pago */
.pay{display:grid;gap:12px}
.big{display:flex;align-items:center;gap:16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.big .t{flex:1}.big h3{margin:0;font-family:var(--disp);font-weight:400;font-size:24px;letter-spacing:.04em}
.big p{margin:6px 0 0;font-size:14px;line-height:1.4;color:var(--muted)}
.big.on{border-color:rgba(53,178,116,.5)}
.note{padding:14px 16px;border-radius:14px;background:#2a2010;color:#ffd98a;font-size:14px;line-height:1.45}

/* sin terminar */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--s1);color:var(--muted);font-weight:700}
.tabs button[aria-pressed=true]{background:var(--text);border-color:var(--text);color:#141312}
.ul{display:grid;gap:10px;margin-top:14px}
.ui{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14px;line-height:1.45}
.ui .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ui b{font-size:16px}
.why{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;background:#3a2c0a;color:#ffd98a;font-size:12px;font-weight:700}
.why.rej{background:#3a1218;color:#ffc9d0}
.ui .m{color:var(--muted)}
.ui .who{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.call{display:inline-flex;align-items:center;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--s2);font-weight:600;font-size:14px}
.hint{margin:16px 2px 0;font-size:12px;color:var(--muted);line-height:1.5}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:#3a1218;color:#ffc9d0;padding:11px 18px;border-radius:999px;font-size:14px;max-width:90vw}

@media (min-width:980px){
  .shell{padding-left:280px}
  .drawer{transform:none;width:280px}
  .scrim,.top .menu,#closeBtn{display:none}
  .top{padding-left:18px}
  main{padding:30px 32px 120px}
  .grid{grid-template-columns:repeat(3,1fr)}
  .card.wide{grid-column:auto;min-height:150px;flex-direction:column;align-items:stretch;justify-content:space-between}
  .savebar{left:280px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="login" id="loginWrap">
  <form id="login" autocomplete="off">
    <img src="/logo-mafia-blanco.webp" onerror="this.onerror=null;this.src='/assets/logo-mafia-blanco.webp'" alt="MAFIA">
    <h1 class="disp">Panel de administración</h1>
    <input id="password" type="password" autocomplete="current-password" placeholder="Clave" aria-label="Clave de administrador" required>
    <button class="btn" type="submit">Entrar</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <header class="top">
    <button class="ico menu" id="menuBtn" type="button" aria-label="Abrir menú" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1 class="disp" id="title">Inicio</h1>
    <a class="carta" href="/" target="_blank" rel="noopener">Ver carta ↗</a>
  </header>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Menú">
    <div class="dhead"><img src="/logo-mafia-blanco.webp" onerror="this.onerror=null;this.src='/assets/logo-mafia-blanco.webp'" alt="MAFIA"><button class="ico menu" id="closeBtn" type="button" aria-label="Cerrar menú"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="nav" id="nav"></nav>
    <div class="nav foot"><div class="sep"></div><button type="button" id="logout"><svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>Cerrar sesión</button></div>
  </aside>

  <main id="view"></main>
  <div class="savebar" id="savebar" hidden><span>Cambios sin guardar</span><button class="btn" id="saveBtn" type="button">Guardar cambios</button></div>
</div>
<div class="toast" id="toast" role="alert" hidden></div>

<script>
const API = { av:"/.netlify/functions/menu-availability", pay:"/.netlify/functions/pay-switch", unp:"/.netlify/functions/orders-unpaid", ord:"/.netlify/functions/orders-list" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clp = n => "$" + new Intl.NumberFormat("es-CL").format(n || 0);
const when = d => new Date(d).toLocaleString("es-CL", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
const I = {
  menu:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>',
  orders:'<svg viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v17l-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6"/></svg>',
  box:'<svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  card:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  menuBook:'<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'
};
const VIEWS = { inicio:"Inicio", productos:"Productos", pago:"Pago online", "sin-terminar":"Sin terminar" };

let pass = "", role = "", dirty = false, saving = false;
const isAdmin = () => role === "admin";
const S = { catalog:[], dp:new Set(), dop:{}, pay:null, unp:null, unpDays:7, today:null, q:"", cat:"all" };

async function call(url, body){
  const r = await fetch(url + "?t=" + Date.now(), { method:"POST", cache:"no-store", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ password:pass, ...body }) });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw Object.assign(new Error(d.error || "No se pudo completar"), { status:r.status });
  return d;
}
const toast = (t, ms = 3500) => { const el = $("#toast"); el.textContent = t; el.hidden = !t; if (t) setTimeout(() => el.hidden = true, ms); };
function setState(d){ S.dp = new Set(d.disabledProducts || []); S.dop = {}; Object.entries(d.disabledOptions || {}).forEach(([id, v]) => S.dop[id] = new Set((v || []).map(String))); }

/* ---------- menú ---------- */
function drawNav(){
  const cur = route(), n = S.today ? S.today.nuevos : 0, A = isAdmin();
  const item = (id, ico, label, extra = "") => `<a href="#/${id}" class="${cur === id ? "on" : ""}">${ico}${label}${extra}</a>`;
  $("#nav").innerHTML =
    item("inicio", I.home, "Inicio") +
    `<a href="/caja/">${I.orders}Pedidos${n ? `<span class="badge">${n}</span>` : ""}</a>` +
    item("productos", I.box, "Productos") +
    (A ? item("pago", I.card, "Pago online") + item("sin-terminar", I.clock, "Compras sin terminar") : "") +
    `<div class="sep"></div><a href="/" target="_blank" rel="noopener">${I.menuBook}Ver carta</a>`;
}
const openMenu = on => { document.body.classList.toggle("menu-open", on); $("#menuBtn").setAttribute("aria-expanded", on); };
$("#menuBtn").onclick = () => openMenu(true);
$("#closeBtn").onclick = $("#scrim").onclick = () => openMenu(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") openMenu(false); });

/* ---------- vistas ---------- */
const route = () => { const h = (location.hash || "").replace(/^#\/?/, ""); return VIEWS[h] && (isAdmin() || (h !== "pago" && h !== "sin-terminar")) ? h : "inicio"; };
function render(){
  const v = route(); $("#title").textContent = VIEWS[v]; document.title = "MAFIA · " + VIEWS[v];
  ({ inicio:vHome, productos:vProducts, pago:vPay, "sin-terminar":vUnpaid })[v]();
  $("#savebar").hidden = !(v === "productos" && dirty);
  drawNav(); openMenu(false); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

function vHome(){
  const t = S.today, off = S.catalog.filter(x => S.dp.has(x.id)).length, p = S.pay, A = isAdmin();
  $("#view").innerHTML = `
    <div class="hello"><h2 class="disp">Hola</h2><p>${new Date().toLocaleDateString("es-CL", { weekday:"long", day:"numeric", month:"long" })}</p></div>
    <div class="stats">
      <div class="stat ${t && t.nuevos ? "hot" : ""}"><b>${t ? t.nuevos : "–"}</b><span>Por aceptar</span></div>
      <div class="stat"><b>${t ? t.n : "–"}</b><span>Pedidos<br>últimas 24 h</span></div>
      ${A ? `<div class="stat ok"><b>${t ? clp(t.total) : "–"}</b><span>Vendido<br>últimas 24 h</span></div>` : `<div class="stat"><b>${off}</b><span>Productos<br>agotados</span></div>`}
    </div>
    <div class="grid">
      <a class="card main" href="/caja/">${t && t.nuevos ? `<span class="tag">${t.nuevos}</span>` : ""}<span class="ci">${I.orders}</span><div><h3>Pedidos</h3><p>${t && t.nuevos ? t.nuevos + (t.nuevos === 1 ? " pedido por aceptar" : " pedidos por aceptar") : "Panel de caja y cocina"}</p></div></a>
      <a class="card" href="#/productos"><span class="ci">${I.box}</span><div><h3>Productos</h3><p>${off ? off + (off === 1 ? " agotado" : " agotados") : "Todo disponible"}</p></div></a>
      ${A ? `<a class="card" href="#/pago"><span class="ci">${I.card}</span><div><h3>Pago online</h3><p><span class="dot ${p ? (p.online ? "on" : "off") : ""}"></span>${p ? (p.online ? "Encendido" : "Apagado") : "…"}</p></div></a>`: ""}
      ${A ? `<a class="card" href="#/sin-terminar"><span class="ci">${I.clock}</span><div><h3>Sin terminar</h3><p>${S.unp ? S.unp.unpaid_count + " no pagaron en " + S.unp.days + " días" : "Quién no completó su compra"}</p></div></a>` : ""}
      <a class="card wide" href="/" target="_blank" rel="noopener"><span class="ci">${I.menuBook}</span><div><h3>Ver carta</h3><p>Abre la carta como la ve el cliente</p></div></a>
    </div>`;
}

function vProducts(){
  const cats = [...new Set(S.catalog.map(x => x.category))], offN = S.catalog.filter(x => S.dp.has(x.id)).length;
  $("#view").innerHTML = `
    <div class="view-h"><p>Toca la foto para marcar un producto como agotado. Se oculta de la carta apenas guardes.</p></div>
    <div class="search">${I.search}<input id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto" value="${esc(S.q)}"></div>
    <div class="chips" id="chips">
      <button class="chip" type="button" data-c="all" aria-pressed="${S.cat === "all"}">Todo</button>
      <button class="chip warn" type="button" data-c="off" aria-pressed="${S.cat === "off"}">Agotados${offN ? " · " + offN : ""}</button>
      ${cats.map(c => `<button class="chip" type="button" data-c="${esc(c)}" aria-pressed="${S.cat === c}">${esc(c)}</button>`).join("")}
    </div>
    <div id="plist"></div>`;
  $("#q").oninput = e => { S.q = e.target.value; drawProducts(); };
  $("#chips").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; S.cat = b.dataset.c; [...$("#chips").children].forEach(x => x.setAttribute("aria-pressed", x === b)); drawProducts(); };
  $("#plist").onclick = e => { const t = e.target.closest("[data-tap]"); if (!t) return; const cb = [...document.querySelectorAll("[data-p]")].find(x => x.dataset.p === t.dataset.tap); if (cb){ cb.checked = !cb.checked; cb.dispatchEvent(new Event("change", { bubbles:true })); } };
  $("#plist").onchange = e => {
    const p = e.target.closest("[data-p]"), o = e.target.closest("[data-o]");
    if (p){ p.checked ? S.dp.delete(p.dataset.p) : S.dp.add(p.dataset.p); }
    else if (o){ const id = o.dataset.o, i = o.dataset.i; S.dop[id] = S.dop[id] || new Set(); o.checked ? S.dop[id].delete(i) : S.dop[id].add(i); }
    else return;
    dirty = true; $("#savebar").hidden = false; drawProducts(true);
  };
  drawProducts();
}
function drawProducts(keep){
  const q = S.q.trim().toLowerCase(), box = $("#plist"); if (!box) return;
  const y = window.scrollY;
  let items = S.catalog.filter(x => (S.cat === "all" || (S.cat === "off" ? S.dp.has(x.id) : x.category === S.cat)) && (!q || x.name.toLowerCase().includes(q)));
  if (!items.length){ box.innerHTML = `<p class="none">${S.cat === "off" ? "No hay productos agotados 🎉" : "No encontré productos con ese nombre."}</p>`; return; }
  const groups = {}; items.forEach(x => (groups[x.category] = groups[x.category] || []).push(x));
  box.innerHTML = Object.entries(groups).map(([cat, list]) => `<h3 class="cat">${esc(cat)}</h3><div class="tiles">` + list.map(it => {
    const on = !S.dp.has(it.id);
    const subs = (it.options || []).map((name, i) => { const o = !(S.dop[it.id] && S.dop[it.id].has(String(i))); return `<div class="prow"><span>${esc(name)}</span><label class="sw"><input type="checkbox" data-o="${esc(it.id)}" data-i="${i}" ${o ? "checked" : ""} ${on ? "" : "disabled"} aria-label="${esc(it.name)} ${esc(name)} disponible"><i></i></label></div>`; }).join("");
    return `<div class="tile ${on ? "" : "off"}"><div class="ph" data-tap="${esc(it.id)}"><span class="ini">${esc((it.name || "?").trim().charAt(0))}</span>${it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}${on ? "" : '<span class="sold">AGOTADO</span>'}</div><div class="tb"><div><b>${esc(it.name)}</b><span class="state ${on ? "" : "off"}">${on ? "Disponible" : "Agotado"}</span></div><label class="sw"><input type="checkbox" data-p="${esc(it.id)}" ${on ? "checked" : ""} aria-label="${esc(it.name)} disponible"><i></i></label></div>${subs ? `<div class="subs">${subs}</div>` : ""}</div>`;
  }).join("") + "</div>").join("");
  if (keep) window.scrollTo(0, y);
}
async function save(){
  if (!dirty || saving) return; saving = true;
  const b = $("#saveBtn"); b.disabled = true; b.textContent = "Guardando…";
  try {
    const d = await call(API.av, { action:"set", disabledProducts:[...S.dp], disabledOptions:Object.fromEntries(Object.entries(S.dop).map(([id, s]) => [id, [...s]])) });
    setState(d); dirty = false; toast("Cambios guardados ✓", 2200); if (route() === "productos") vProducts(); $("#savebar").hidden = true;
  } catch(e){ toast(e.message); }
  finally { saving = false; b.disabled = false; b.textContent = "Guardar cambios"; }
}
$("#saveBtn").onclick = save;
window.addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });

function vPay(){
  const p = S.pay; if (!p){ $("#view").innerHTML = '<p class="none">Cargando…</p>'; return; }
  $("#view").innerHTML = `
    <div class="view-h"><p>Controla si tus clientes pueden pagar con Mercado Pago en la carta.</p></div>
    <div class="pay">
      <div class="big ${p.online ? "on" : ""}"><div class="t"><h3>${p.online ? "Encendido" : "Apagado"}</h3><p>${p.online ? "Los clientes pueden pagar con la app de Mercado Pago o con tarjeta." : "Los clientes solo pueden hacer su pedido por WhatsApp."}</p></div><label class="sw"><input type="checkbox" id="paySw" ${p.online ? "checked" : ""} aria-label="Pago online activo"><i></i></label></div>
      ${p.online && !p.ready ? '<div class="note">Falta configurar Mercado Pago en Netlify: el pago no aparecerá en la carta aunque esté encendido.</div>' : ""}
      <p class="hint">Se aplica al instante. Los pagos que ya estaban en curso se siguen confirmando.</p>
    </div>`;
  $("#paySw").onchange = async e => { const want = e.target.checked; e.target.disabled = true; try { S.pay = await call(API.pay, { action:"set", online:want }); } catch(err){ toast(err.message); } vPay(); drawNav(); };
}

function vUnpaid(){
  const u = S.unp;
  $("#view").innerHTML = `
    <div class="view-h"><p>Personas que llegaron al paso de pago y no pagaron.</p></div>
    <div class="tabs" id="tabs">${[[1, "Hoy"], [7, "7 días"], [30, "30 días"]].map(([d, l]) => `<button type="button" data-d="${d}" aria-pressed="${S.unpDays === d}">${l}</button>`).join("")}</div>
    <div id="ub">${u ? "" : '<p class="none">Cargando…</p>'}</div>`;
  $("#tabs").onclick = e => { const b = e.target.closest("[data-d]"); if (!b) return; S.unpDays = +b.dataset.d; S.unp = null; vUnpaid(); loadUnpaid(); };
  if (u) drawUnpaid();
}
function drawUnpaid(){
  const u = S.unp, box = $("#ub"); if (!u || !box) return;
  const pct = u.started ? Math.round(u.paid * 100 / u.started) : 0;
  box.innerHTML = `
    <div class="stats"><div class="stat"><b>${u.started}</b><span>Llegaron a pagar</span></div><div class="stat ok"><b>${u.paid}</b><span>Pagaron · ${pct}%</span></div><div class="stat bad"><b>${u.unpaid_count}</b><span>No pagaron</span></div></div>
    <div class="ul">${u.unpaid.length ? u.unpaid.map(x => `<div class="ui"><div class="l1"><b>#${esc(x.short_code)} · ${clp(x.total)}</b><span class="m">${when(x.created_at)}</span></div><span class="why ${/rechaz/i.test(x.reason) ? "rej" : ""}">${esc(x.reason)}</span><div class="m" style="margin-top:8px">${x.delivery_type === "delivery" ? "Delivery" : "Retiro"} · ${x.items.map(i => i.quantity + "× " + esc(i.name)).join(", ")}</div><div class="who"><span>${esc(x.customer.name)}</span>${x.customer.phone ? `<a class="call" href="tel:${esc(x.customer.phone)}">Llamar</a>` : ""}</div></div>`).join("") : '<p class="none">Nadie dejó un pago a medias en este período.</p>'}</div>
    <p class="hint">Cuenta a quienes llegaron al paso de pago. Quienes agregan al carrito y se van antes aparecen en PostHog.</p>`;
}
async function loadUnpaid(){ try { S.unp = await call(API.unp, { days:S.unpDays }); if (route() === "sin-terminar") drawUnpaid(); else if (route() === "inicio") vHome(); } catch(e){ toast(e.message); } }
async function loadToday(){
  try { const d = await call(API.ord, { days:1 }); const o = d.orders || [];
    S.today = { n:o.length, total:o.reduce((s, x) => s + (x.paid_total ?? x.total ?? 0), 0), nuevos:o.filter(x => x.kitchen_status === "nuevo").length };
    if (route() === "inicio") vHome(); drawNav(); } catch(e){}
}
async function loadPay(){ try { S.pay = await call(API.pay, { action:"get" }); const v = route(); if (v === "pago") vPay(); else if (v === "inicio") vHome(); } catch(e){} }

/* ---------- acceso ---------- */
$("#login").addEventListener("submit", async e => {
  e.preventDefault(); pass = $("#password").value; if (!pass) return; $("#loginErr").textContent = "";
  try {
    const d = await call(API.av, { action:"login" });
    S.catalog = d.catalog || []; role = d.role || "staff"; setState(d);
    $("#loginWrap").hidden = true; $("#shell").hidden = false; render();
    if (isAdmin()){ loadPay(); loadUnpaid(); }
    loadToday();
    setInterval(loadToday, 30000);
  } catch(err){ $("#loginErr").textContent = err.status === 401 ? "Clave incorrecta" : err.message; pass = ""; }
});
$("#logout").onclick = () => location.reload();
</script>
</body>
</html>
