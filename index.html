<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta · MAFIA</title>
<meta name="description" content="Carta digital de MAFIA. Pizzas, pastas, proteínas y combos.">
<meta name="theme-color" content="#0c0c0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0c; --surface:#161514; --line:#2a2826;
  --text:#f3ede2; --muted:#a39d92;
  --red:#c8102e; --red-hi:#e0213f; --red-dim:rgba(200,16,46,.16);
  --r:14px;          /* una sola forma para todo: fotos, botones, formatos, paneles */
  --mw:108px;        /* ancho de la foto y del botón de precio (siempre iguales) */
  --serif:"Playfair Display",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
@media(min-width:600px){:root{--mw:128px}}
@media(max-width:340px){:root{--mw:92px}}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 var(--sans);
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:3px}

/* ---------- Cabecera ---------- */
.top{padding:calc(40px + env(safe-area-inset-top,0px)) 20px 32px;text-align:center}
.brand{font:400 clamp(48px,13vw,96px)/.9 var(--serif);letter-spacing:.05em;color:var(--red)}
.brand .logo{display:block;margin:0 auto;width:auto;height:auto;max-width:70%;max-height:clamp(56px,15vw,88px)}
 .info{margin:12px auto 0;max-width:34ch;font-size:13px;line-height:1.45;color:var(--text);opacity:.78}

/* ---------- Navegación de categorías ---------- */
.nav{position:sticky;top:0;z-index:20;background:rgba(12,12,12,.93);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1160px;margin:0 auto;display:flex;align-items:center}
.nav ul{position:relative;flex:1;min-width:0;list-style:none;display:flex;gap:8px;overflow-x:auto;padding:12px 8px 12px 16px;scrollbar-width:none}
.cartbtn{position:relative;flex:none;width:44px;height:44px;margin:0 14px 0 4px;display:grid;place-items:center;border-radius:var(--r);border:1px solid var(--text);background:var(--text);color:#16130f;transition:filter .15s}
.cartbtn::before{content:"";position:absolute;right:100%;top:-8px;bottom:-8px;width:20px;background:linear-gradient(to left,var(--bg),transparent);pointer-events:none}
.cartbtn:hover{filter:brightness(.92)}
.cartbtn.pop{animation:pop .35s}
.cbadge{position:absolute;top:-5px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;border:2px solid var(--bg);background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:16px;text-align:center}
.cbadge[hidden]{display:none}
.cbadge.pop{animation:pop .4s}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;min-height:44px;white-space:nowrap;padding:2px 16px 0;border-radius:var(--r);
  border:1px solid var(--line);color:var(--muted);text-decoration:none;font:400 15px/1.2 var(--serif);letter-spacing:.06em;
  transition:background .15s,border-color .15s}
.nav a:hover{border-color:var(--muted);color:var(--text)}
.nav a[aria-current="true"]{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- Secciones ---------- */
main{max-width:1160px;margin:0 auto;padding:0 20px}
.cat{padding-top:64px;scroll-margin-top:64px}
.cat:first-of-type{padding-top:56px}
.cat:last-of-type{min-height:calc(100dvh - 140px)}
.cat h2{display:flex;align-items:center;gap:16px;font:400 clamp(36px,9.5vw,44px)/1 var(--serif);letter-spacing:.04em;color:var(--red)}
.cat h2::after{content:"";flex:1;height:1px;background:var(--line)}
.cat .note{margin-top:10px;color:var(--muted);font-size:14px;max-width:60ch}
.list{display:grid;grid-template-columns:1fr;column-gap:56px;margin-top:12px}
@media(min-width:880px){.list{grid-template-columns:1fr 1fr}}

.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;padding:22px 0;border-bottom:1px solid var(--line)}
.item h3{font:400 24px/1.05 var(--serif);letter-spacing:.03em}
.item:last-child{border-bottom:0}
@media(min-width:880px){.list .item:nth-last-child(2):nth-child(odd){border-bottom:0}}
.item.nopic{align-items:center;padding:14px 0}
.item.nopic .row2{grid-column:2;grid-row:1;min-height:0}
.hd{grid-column:1;grid-row:1;display:grid;gap:5px;align-content:start;min-width:0}
.row2{min-height:44px;grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.act{margin-left:auto;width:var(--mw)}
.fmt[hidden],.offer[hidden]{display:none!important}
.opts[hidden],.offer[hidden]{display:none}
.offer{flex:1;min-width:0}
.offer.in{animation:fadeSlow .9s ease-out}
.fmt.in{animation:fadeSlow .6s ease-out}
.fmt.out,.offer.out{opacity:0;transition:opacity .28s ease}
@keyframes fadeSlow{from{opacity:0}to{opacity:1}}
.of{display:grid;gap:1px;width:100%;min-height:44px;padding:6px 16px 7px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);text-align:left;transition:border-color .15s}
.of:hover{border-color:var(--muted)}
.of-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.of-h b{font:400 19px/1.05 var(--serif);letter-spacing:.03em}
.of-h i{font-style:normal;font-size:14px;font-weight:600;color:var(--red-hi)}
.of-s{font-size:12px;line-height:1.3;color:var(--muted)}
.desc{margin:0;color:var(--muted);font-size:14px;line-height:1.45;max-width:46ch}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{min-height:44px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:none;color:var(--text);font-size:14px;font-weight:500;transition:border-color .15s,background .15s}
.opts button:hover{border-color:var(--muted)}
.opts button[aria-pressed="true"]{border-color:var(--text);background:rgba(243,237,226,.1)}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pick{grid-column:1 / -1;display:grid;gap:8px}
.pk-t{font-size:12px;color:var(--muted)}
.pk-err{margin:0;font-size:12px;color:#ff8a8a}
.pick.shake,.fmt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.media{grid-column:2;grid-row:1;position:relative;width:var(--mw);height:var(--mw);align-self:start}
.media img,.ph{display:block;width:100%;height:100%;object-fit:cover;border-radius:var(--r)}
.ph{border:1px solid var(--line);
  background:repeating-linear-gradient(135deg,#1b1a19 0 10px,#211f1d 10px 20px)}
.add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;padding:0 10px;border:0;border-radius:var(--r);background:var(--red);color:#fff;font-size:14px;font-weight:600;transition:background .15s,transform .15s}
.add .pl{font-size:20px;line-height:1;font-weight:500}
.add:hover{background:var(--red-hi)}
@media(max-width:380px){
  .row2{gap:6px}
  .opts button{padding:0 9px}
  .of{padding:6px 12px 7px}
}
@media(max-width:340px){
  .opts button{padding:0 6px}
  .row2{gap:4px}
}
.zoom{display:block;width:100%;height:100%;padding:0;border:0;background:none;border-radius:var(--r);cursor:zoom-in}
.stp{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;border-radius:var(--r);background:var(--red);color:#fff}
.stp[hidden],.add[hidden]{display:none}
.stp button{flex:0 0 40px;height:100%;border:0;background:none;color:#fff;font-size:20px;line-height:1}
.stp span{flex:1;text-align:center;font-weight:700;font-size:16px}
.stp.pop{animation:pop .3s}
.lb{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.96)}
.lb[hidden]{display:none}
.lb figure{display:grid;gap:12px;justify-items:center;text-align:center}
.lb img{display:block;max-width:min(92vw,820px);max-height:76dvh;border-radius:var(--r)}
.lb figcaption{font:400 24px/1.1 var(--serif);letter-spacing:.03em;color:#f3ede2;max-width:46ch}
.lb figcaption small{display:block;margin-top:4px;color:#a39d92;font:400 14px/1.4 var(--sans)}
.lb-x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:var(--r);border:1px solid #3a3836;background:#161514;color:#fff;font-size:20px}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.add:active{transform:scale(.96)}

footer{max-width:1160px;margin:56px auto 0;padding:24px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:grid;gap:6px}
footer b{color:var(--text);font-weight:600}

/* ---------- Bandeja inferior de sugerencias ---------- */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;width:min(560px,calc(100% - 24px));
  transform:translateX(-50%);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none}
.dock.on{display:block}
.suggest{padding:10px 12px;background:#ebe2cf;color:#1c1813}
.suggest[hidden]{display:none}
.suggest.in{animation:rise .5s ease-out}
.suggest.out{opacity:0;transform:translateY(6px);transition:opacity .18s ease,transform .18s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sg-top b{font:400 19px/1.1 var(--serif);letter-spacing:.03em;color:#1c1813}
.sg-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sg-x{flex:none;width:44px;height:44px;margin:-10px -10px -10px 0;border:0;border-radius:var(--r);background:none;color:#5f5545;font-size:15px}
.sg-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sg-add{flex:1 1 auto;white-space:nowrap;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 14px;border-radius:var(--r);border:1px solid #cdbf9f;background:#f7f1e3;color:#1c1813;font-size:14px;font-weight:500;text-align:left}
.sg-add b{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:14px;color:var(--red)}
.sg-add b .pl{font-size:16px;line-height:1;font-weight:500}
.sg-add:hover{border-color:#1c1813}
body.has-sug{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}

/* ---------- Panel del pedido ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:88dvh;display:flex;flex-direction:column;
  background:#141312;border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;
  transform:translateY(105%);transition:transform .25s ease;overflow-y:auto;overscroll-behavior:contain}
.drawer > *{flex-shrink:0}
.drawer.on{transform:none}
@media(min-width:900px){
  .scrim{display:none}
  .drawer{left:auto;top:0;width:420px;max-height:none;border-radius:0;border-top:0;border-bottom:0;transform:translateX(105%)}
  body.panel-open .dock{display:none}
  main,footer{transition:margin .25s}
  body.panel-open main,body.panel-open footer{margin-right:max(20px,calc((100% - 1160px) / 2 + 420px - 20px))}
}
.dh{position:sticky;top:0;z-index:2;background:#141312;display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px}
.dh h2{font:400 24px/1 var(--serif);letter-spacing:.03em}
.x{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:none;font-size:20px}
.lines{flex:none;padding:0 20px}
.empty{padding:28px 0;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line b{font-weight:600}
.line small{display:block;color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:10px;grid-row:span 2;align-self:center}
.qty button{width:40px;height:40px;border-radius:var(--r);border:1px solid var(--line);background:none;font-size:18px;line-height:1}
.qty span{min-width:18px;text-align:center;font-weight:600}
.df{margin-top:auto;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:10px}
.df label{font-size:12px;color:var(--muted)}
.df input:not([type="radio"]),.df textarea{width:100%;margin-top:4px;padding:12px 13px;border-radius:var(--r);border:2px solid #fff;
  background:#fff;color:#16130f;font:inherit;font-size:16px;resize:vertical}
.df input:not([type="radio"])::placeholder,.df textarea::placeholder{color:#8a8378}
.df input:not([type="radio"]):focus,.df textarea:focus{outline:none;border-color:var(--red)}
.sug{padding:16px 0 8px}
.sug p{font-size:12px;color:var(--muted);margin-bottom:4px}
.sug-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:14px}
.sug-row b{font-weight:500;color:var(--muted);margin-left:6px}
.sug-row button{width:40px;height:40px;border-radius:var(--r);border:1px solid var(--red);background:none;color:var(--text);font-size:18px;line-height:1}
.sug-row button:hover{background:var(--red-dim)}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:600;padding-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:block;margin:0;color:var(--text)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;text-align:center;padding:13px 8px;border-radius:var(--r);border:1px solid var(--line);font-size:14px;font-weight:500;cursor:pointer}
.seg input:checked + span{border-color:var(--red);background:var(--red-dim)}
.seg input:focus-visible + span{outline:2px solid var(--red-hi);outline-offset:2px}
.err{color:#ff8a8a;font-size:12px;min-height:0}
.err:empty{display:none}
.hint{font-size:12px;color:var(--muted)}
  .dnote{margin:-4px 0 0;font-size:12px;color:var(--muted)}
.dnote[hidden]{display:none}
.paynote{padding:10px 14px;border-radius:var(--r);background:var(--red-dim);font-size:14px;line-height:1.4}
.paynote b{display:block;font:400 19px/1.15 var(--serif);letter-spacing:.03em}
.paynote span{color:var(--muted)}
.steps{margin:0 0 0 18px;padding:0;display:grid;gap:2px;font-size:12px;color:var(--muted)}
.pay{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:12px}
.pay[hidden]{display:none}
.pay-t{margin-bottom:6px;font-size:14px}
.pay-t b{color:var(--red-hi)}
#payRows div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
#payRows span{color:var(--muted)}
#payRows b{font-weight:500;text-align:right}
.copy{margin-top:8px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:none;font-size:14px}
.send{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 14px #141312;padding:15px;border:0;border-radius:var(--r);background:var(--red);color:#fff;font-weight:600;font-size:16px}
.send:hover{background:var(--red-hi)}
.send:disabled{opacity:.45;cursor:not-allowed}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}

/* ---------- Combo: etiqueta sobre la foto, interruptor y hoja ---------- */
.tag{position:absolute;left:8px;bottom:8px;z-index:2;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 8px;border:0;border-radius:var(--r);background:rgba(12,12,12,.84);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--text);font-size:12px;font-weight:600;transition:background .15s}
.tag[hidden],.tog[hidden]{display:none}
.tag .tp{display:grid;place-items:center;width:22px;height:22px;border-radius:var(--r);background:var(--red);color:#fff;font-size:15px;line-height:1}
.tag em,.tog em{font-style:normal;color:var(--red-hi)}
.tag[aria-checked="true"]{background:var(--text);color:#16130f}
.tag[aria-checked="true"] em{color:#a50d26}
.tog{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);text-align:left;transition:border-color .15s,background .15s}
.tog .sw{flex:none;position:relative;width:32px;height:20px;border-radius:var(--r);background:var(--line);transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:var(--r);background:#fff;transition:transform .15s}
.tog[aria-checked="true"]{border-color:var(--text);background:rgba(243,237,226,.08)}
.tog[aria-checked="true"] .sw{background:var(--red)}
.tog[aria-checked="true"] .sw::after{transform:translateX(12px)}
.tog .tt{flex:1;min-width:0;display:grid;line-height:1.25}
.tog .tt b{font-size:13px;font-weight:600}
.tog em,.tag em{white-space:nowrap}
.tog .tt small{font-size:12px;color:var(--muted)}
.row2 .tog{order:9;flex:1 1 100%}
.shbd{position:fixed;inset:0;z-index:54;background:rgba(0,0,0,.6)}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:55;width:min(560px,100%);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;background:#161514;border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0}
.shbd[hidden],.sheet[hidden]{display:none}
.sheet.in{animation:sheetUp .3s ease-out}
@keyframes sheetUp{from{opacity:0;transform:translate(-50%,24px)}to{opacity:1;transform:translateX(-50%)}}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-h b{display:block;font:400 24px/1.05 var(--serif);letter-spacing:.03em}
.sh-h span{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
.sh-g{display:grid;gap:8px}
.sh-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);text-align:left}
.sh-opt[aria-checked="true"]{border-color:var(--text);background:rgba(243,237,226,.08)}
.sh-opt .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted)}
.sh-opt[aria-checked="true"] .rd{border-color:var(--red);background:radial-gradient(var(--red) 45%,transparent 50%)}
.sh-opt .tx{flex:1;min-width:0;display:grid;line-height:1.25}
.sh-opt .tx b{font-size:14px;font-weight:600}
.sh-opt .tx small{font-size:12px;color:var(--muted)}
.sh-opt i{font-style:normal;font-size:14px;font-weight:600}
.sh-add{min-height:48px}
.sheet{max-height:88dvh;overflow-y:auto}
.sh-lab{margin:2px 0 8px;font-size:14px;font-weight:600}
.sh-lab small{font-weight:400;color:var(--muted)}
.exg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sh-chk{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);text-align:left}
.sh-chk .tx{display:grid;line-height:1.2;min-width:0}
.sh-chk .tx b{font-size:14px;font-weight:600}
.sh-chk .tx small{font-size:12px;color:var(--muted)}
.sh-chk .bx{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:var(--r);border:1.5px solid var(--muted);font-size:15px;line-height:1}
.sh-chk[aria-checked="true"]{border-color:var(--text);background:rgba(243,237,226,.08)}
.sh-chk[aria-checked="true"] .bx{background:var(--red);border-color:var(--red);color:#fff;font-size:13px}
.of-s .p2{display:none}
html[data-layout="grid"] .of-h .p1{display:none}
html[data-layout="grid"] .of-s .p2{display:inline;font-style:normal;font-weight:600;color:var(--red-hi)}

/* Tipografías propias: si el archivo no existe, se usan Playfair Display / Inter */
function loadFont(family, file, varName, fallback){
  if (!file) return;
  const ext = file.indexOf("data:") === 0 ? file.slice(5).split(/[;,]/)[0].split("/").pop() : file.split(".").pop().toLowerCase();
  const fmt = { woff2:"woff2", woff:"woff", ttf:"truetype", otf:"opentype" }[ext];
  if (file.indexOf("data:") !== 0 && ext){      /* precarga: evita ver otra letra un instante */
    const l = document.createElement("link"); l.rel = "preload"; l.as = "font"; l.type = "font/" + ext; l.crossOrigin = ""; l.href = file; document.head.appendChild(l);
  }
  const st = document.createElement("style");
  st.textContent = `@font-face{font-family:"${family}";src:url("${file}")${fmt ? ` format("${fmt}")` : ""};font-weight:100 900;font-display:block}`;
  document.head.appendChild(st);
  document.documentElement.style.setProperty(varName, `"${family}",${fallback}`);
}

/* ---------- Render de la carta ---------- */
const comboOf = (it, o) => it.combo ? (it.combo.byOption ? it.combo.byOption[o] : it.combo.all) : null;
const pickName = (it, pi) => (it.pick && pi >= 0 && it.pick.list && it.pick.list[pi] != null) ? it.pick.list[pi] : null;
const basePrice = (it, o, pi=-1) => {
  if (it.options) return it.options[o].price;
  const pk = pickName(it, pi);
  if (it.priceByPick && pk && it.priceByPick[pk] != null) return it.priceByPick[pk];
  return it.price;
};
const unitPrice = (it, o, c, pi=-1) => basePrice(it, o, pi) + (c && comboOf(it, o) ? comboOf(it, o).extra : 0);
const AUTO_PHOTO_IDS = new Set(["tgm","pepperoni","pollo-bbq","napolitana","margarita","ajillo","funghi","chocleta"]);
const photoSrc = (it, pi=-1) => {
  if (it.img) return it.img;
  const picked = pickName(it, pi);
  const f = (it.photoBy && picked && it.photoBy[picked]) || it.foto || (AUTO_PHOTO_IDS.has(it.id) ? it.id : "");
  return f && CONFIG.fotosCarpeta != null ? CONFIG.fotosCarpeta + f + "." + CONFIG.fotosExtension : "";
};

function itemHTML(it, compact){
  const s = S(it.id);
  const src = it.img || (CONFIG.fotosCarpeta != null ? CONFIG.fotosCarpeta + (it.foto || it.id) + "." + CONFIG.fotosExtension : "");
  const media = src
    ? `<button class="zoom" type="button" aria-label="Ver foto de ${esc(it.name)}"><img class="dish" src="${esc(src)}" alt="" loading="lazy"></button>`
    : `<div class="ph" aria-hidden="true"></div>`;
  if (it.infoOnly){
    return `<article class="item" data-id="${esc(it.id)}">
      <div class="hd"><h3>${esc(it.name)}</h3>${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ""}</div>
      ${compact ? "" : `<div class="media">${media}</div>`}
      <div class="row2">
        <div class="act jump-card"><button class="add" type="button" data-jump="${esc(it.jump || "pizzas")}" aria-label="${esc(it.name)}: ir a pizzas"><span>Ver pizzas</span></button></div>
      </div>
    </article>`;
  }
  const fmtH = it.options ? `<div class="opts fmt" role="group" aria-label="Formato de ${esc(it.name)}">${
    it.options.map((op, i) => `<button type="button" data-opt="${i}" aria-pressed="${i === s.o}">${esc(op.label)}</button>`).join("")
  }</div>` : "";
  const pk = it.pick ? `<div class="pick" role="group" aria-label="${esc(it.pick.label)}">
      <p class="pk-t">${esc(it.pick.label)}</p>
      <div class="opts">${it.pick.list.map((n, i) => `<button type="button" data-pick="${i}" aria-pressed="${i === s.p}">${esc(n)}</button>`).join("")}</div>
      <p class="pk-err" hidden>Elige una opción para agregar.</p></div>` : "";
  return `<article class="item${compact ? " nopic" : ""}" data-id="${esc(it.id)}">
    <div class="hd"><h3>${esc(it.name)}</h3>${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ""}</div>
    ${compact ? "" : `<div class="media">${media}${it.combo ? `<button class="tag" type="button" role="switch" aria-checked="false" data-combo hidden></button>` : ""}</div>`}
    ${pk}
    <div class="row2">${fmtH}
      <div class="offer" hidden aria-live="polite"></div>
      ${it.combo ? `<button class="tog" type="button" role="switch" aria-checked="false" data-combo hidden></button>` : ""}
      <div class="act">
        <button class="add" type="button" data-add aria-label="Agregar ${esc(it.name)} al pedido"><span class="pl" aria-hidden="true">+</span><span class="ap"></span></button>
        <div class="stp" hidden role="group" aria-label="Cantidad de ${esc(it.name)}">
          <button type="button" data-dec="" aria-label="Quitar uno de ${esc(it.name)}">−</button><span>1</span><button type="button" data-inc="" aria-label="Agregar uno de ${esc(it.name)}">+</button>
        </div>
      </div>
    </div>
  </article>`;
}

function swapPhoto(card){

function pressOnly(btn){ btn.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === btn)); }

/* clave del pedido para la selección actual de la tarjeta (null si falta elegir formato/opción) */
function keyFor(id){
  const it = IDX[id], s = S(id);
  if (it.options && s.o < 0) return null;
  if (it.pick && s.p < 0) return null;
  const o = it.options ? s.o : 0, c = (PRE() && s.c && comboOf(it, o)) ? 1 : 0, p = it.pick ? s.p : -1;
  return [id, o, c, p].join("|");
}
function syncCard(card){
  const id = card.dataset.id, it = IDX[id], s = S(id), o = it.options ? s.o : 0, cb = comboOf(it, o);
  if (it.infoOnly || !card.querySelector(".add")) return;
  if (s.c && (!cb || !PRE())) s.c = false;                 /* el interruptor solo existe si hay combo y la variante lo usa */
  const k = keyFor(id);
  let q = 0, kinc = k, kdec = k;
  if (PRE()){ q = k ? (cart[k] || 0) : 0; }
  else {
    const k1 = k ? k.replace(/\|0\|(-?\d+)$/, "|1|$1") : null;          /* misma selección, versión combo */
    const q0 = k ? (cart[k] || 0) : 0, q1 = k1 ? (cart[k1] || 0) : 0; q = q0 + q1; kdec = q0 > 0 ? k : k1;
  }
  const stp = card.querySelector(".stp"), add = card.querySelector(".add");
  card.querySelector(".ap").textContent = fmt(unitPrice(it, o, PRE() && s.c, s.p));   /* el botón muestra el precio de lo que está elegido */
  stp.hidden = q === 0; add.hidden = q > 0;
  if (q > 0){
    stp.querySelector("span").textContent = q;
    stp.querySelector("[data-inc]").dataset.inc = kinc;
    stp.querySelector("[data-dec]").dataset.dec = kdec;
  }
  /* interruptor (o etiqueta sobre la foto) */
  const tog = card.querySelector(".tog"), tag = card.querySelector(".tag");
  const inc = cb ? cb.desc.replace(/^\+\s*/, "") : "";
  const asTag = DESIGN.cta === "tag" && DESIGN.foto !== "lista";
  if (tog){
    const show = !!cb && ((DESIGN.cta === "toggle") || (DESIGN.cta === "tag" && !asTag));
    tog.hidden = !show;
    if (show){ tog.setAttribute("aria-checked", String(!!s.c)); tog.setAttribute("aria-label", "Hazla combo con " + inc + ", más " + fmt(cb.extra));
      tog.innerHTML = `<span class="sw" aria-hidden="true"></span><span class="tt"><b>Combo <em>+${fmt(cb.extra)}</em></b><small>${esc(inc)}</small></span>`; }
  }
  if (tag){
    const show = !!cb && asTag;
    tag.hidden = !show;
    if (show){ tag.setAttribute("aria-checked", String(!!s.c)); tag.setAttribute("aria-label", "Hazla combo con " + inc + ", más " + fmt(cb.extra));
      tag.innerHTML = `<span class="tp" aria-hidden="true">${s.c ? "✓" : "+"}</span>Combo <em>${fmt(cb.extra)}</em>`; }
  }
  syncOffer(card);
}
function fadeIn(el){ el.classList.remove("in"); void el.offsetWidth; el.classList.add("in"); }
function syncOffer(card){
  if (card._sw) return;
  const id = card.dataset.id, it = IDX[id], off = card.querySelector(".offer"), fm = card.querySelector(".fmt");
  const on = !!(POST() && curOffer && curOffer.id === id && cart[curOffer.k] > 0);
  const swap = (hideEl, showEl) => {
    if (hideEl && !hideEl.hidden){
      hideEl.classList.add("out");
      card._sw = setTimeout(() => { card._sw = 0; hideEl.hidden = true; hideEl.classList.remove("out"); showEl.hidden = false; fadeIn(showEl); syncOffer(card); }, 280);
    } else { showEl.hidden = false; fadeIn(showEl); }
  };
  if (on){
    if (off.dataset.k !== curOffer.k){
      const cb = comboOf(it, +curOffer.k.split("|")[1]), inc = cb.desc.replace(/^\+\s*/, "");
      off.innerHTML = `<button type="button" class="of" data-upgrade="${esc(curOffer.k)}" aria-label="Hazla combo con ${esc(inc)}, más ${fmt(cb.extra)}"><span class="of-h"><b>Hazla combo</b><i class="p1">+ ${fmt(cb.extra)}</i></span><span class="of-s">${esc(inc)}<i class="p2"> · + ${fmt(cb.extra)}</i></span></button>`;
      off.dataset.k = curOffer.k;
    }
    if (off.hidden) swap(fm, off);
  } else if (!off.hidden){
    if (fm) swap(off, fm);
    else { off.classList.add("out"); card._sw = setTimeout(() => { card._sw = 0; off.hidden = true; off.classList.remove("out"); syncOffer(card); }, 280); }
  } else if (fm && fm.hidden){ fm.hidden = false; }
}
function hideOffer(){
  if (!curOffer) return;
  const id = curOffer.id; curOffer = null;
  const c = document.querySelector('.item[data-id="' + id + '"]'); if (c) syncCard(c);
}
function setOffer(id, k){
  const prev = curOffer && curOffer.id;
  curOffer = { id, k, cat:CATOF[id] };
  [prev, id].forEach(x => { const c = x && document.querySelector('.item[data-id="' + x + '"]'); if (c) syncCard(c); });
}
function pop(el){ if (!el) return; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }

/* ---------- Navegación de categorías ---------- */
const navEl = document.querySelector(".nav"), navUl = $("#nav");
const links = [...navUl.querySelectorAll("a")];
const reduced = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
let activeId = null, lock = false, lockTimer, ticking = false;

function setActive(id){
  activeId = id;
  if (curSug && curSug.cat && curSug.cat !== id) hideSuggest();
  links.forEach(a => {
    const on = a.getAttribute("href") === "#" + id;
    on ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current");
    if (on && navUl.scrollWidth > navUl.clientWidth){
      /* solo mueve la barra horizontal, nunca la página */
      navUl.scrollTo({ left: a.offsetLeft - (navUl.clientWidth - a.offsetWidth) / 2, behavior: reduced ? "auto" : "smooth" });
    }
  });
}

function scrollToCat(id){
  const h = document.getElementById("h-" + id);
  const y = h.getBoundingClientRect().top + window.scrollY - navEl.offsetHeight - 16;
  window.scrollTo({ top: Math.max(0, y), behavior: reduced ? "auto" : "smooth" });
}

navUl.addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault();
  const id = a.getAttribute("href").slice(1);
  lock = true; setActive(id); scrollToCat(id);
  clearTimeout(lockTimer);
  lockTimer = setTimeout(() => { lock = false; spy(); }, 900);
});

function spy(){
  ticking = false; if (lock) return;
  const limit = navEl.offsetHeight + 80;
  let cur = MENU[0].id;
  for (const c of MENU){
    if (document.getElementById("h-" + c.id).getBoundingClientRect().top <= limit) cur = c.id;
  }
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = MENU[MENU.length - 1].id;
  if (cur !== activeId) setActive(cur);
}
window.addEventListener("scroll", () => { if (!ticking){ ticking = true; requestAnimationFrame(spy); } }, { passive:true });
window.addEventListener("resize", spy);
setActive(MENU[0].id);

/* ---------- Pedido ---------- */
let cart = {};
try { cart = JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ cart = {}; }

/* clave del pedido:  plato | formato | combo(0/1) | opción elegida (-1 si no aplica) */
function parseKey(k){
  const [id, o, c, p] = k.split("|"); const it = IDX[id]; if (!it) return null;
  const oi = +o || 0, pi = p === undefined ? -1 : +p;
  if (it.options && !it.options[oi]) return null;
  if (it.pick && !it.pick.list[pi]) return null;
  return { it, oi, ci: (+c === 1 && comboOf(it, oi)) ? 1 : 0, pi };
}
Object.keys(cart).forEach(k => { if (!parseKey(k)) delete cart[k]; });

function save(){ try { localStorage.setItem(STORE, JSON.stringify(cart)); } catch(e){} }
function lines(){
  return Object.entries(cart).map(([k, qty]) => {
    const { it, oi, ci, pi } = parseKey(k), cb = comboOf(it, oi);
    const parts = [
      it.options ? it.options[oi].label : "",
      ci ? "Combo: " + cb.desc.replace(/^\+\s*/, "") : "",
      it.pick ? (it.pick.short || it.pick.label) + ": " + it.pick.list[pi] : ""
    ].filter(Boolean);
    return { k, it, qty, parts, price: unitPrice(it, oi, ci, pi), pi, thumb: photoSrc(it, pi) };
  });
}
function totals(){
  const ls = lines();
  return { count: ls.reduce((a,l) => a + l.qty, 0), sum: ls.reduce((a,l) => a + l.qty * l.price, 0), ls };
}
const qtyOf = id => Object.entries(cart).reduce((a, [k, q]) => a + (k.split("|")[0] === id ? q : 0), 0);

const cartbtn = $("#cartbtn"), cbadge = $("#cbadge"), dock = $("#dock"), drawer = $("#drawer"), scrim = $("#scrim");
const wide = window.matchMedia("(min-width:900px)");

const inCart = id => Object.keys(cart).some(k => k.split("|")[0] === id);
const pick = (ids, max) => ids.filter(id => IDX[id] && !IDX[id].options && !IDX[id].pick && !IDX[id].combo && !inCart(id)).slice(0, max);
const sugRow = id => `<div class="sug-row"><span>${esc(IDX[id].name)}<b>+${fmt(IDX[id].price)}</b></span>
  <button type="button" data-sug="${esc(id)}" aria-label="Agregar ${esc(IDX[id].name)}">+</button></div>`;

function panelSuggest(ls){
  const pool = [];
  ls.forEach(l => ((l.it.suggest && l.it.suggest.ids) || []).forEach(id => { if (!pool.includes(id)) pool.push(id); }));
  const ids = pick(pool, 4);
  return ids.length ? `<div class="sug"><p>Agrega algo más</p>${ids.map(sugRow).join("")}</div>` : "";
}

const sugBox = $("#suggest");
let sugOut;
function hideSuggest(){
  curSug = null; document.body.classList.remove("has-sug");
  if (sugBox.hidden){ dock.classList.remove("on"); return; }
  clearTimeout(sugOut); sugBox.classList.add("out");
  sugOut = setTimeout(() => { if (!curSug){ sugBox.hidden = true; sugBox.classList.remove("out"); dock.classList.remove("on"); } }, 180);
}
function setSuggest(x){ curSug = x; drawSuggest(); }
function drawSuggest(){
  const s = curSug; let html = "";
  if (false){  } else if (s && s.type === "ids"){
    const ids = pick(s.it.suggest.ids, 2);
    if (ids.length) html = `<div class="sg-top"><b>${esc(s.it.suggest.text)}</b>
      <button type="button" class="sg-x" data-sgx aria-label="Cerrar sugerencia">✕</button></div>
      <div class="sg-row">${ids.map(id => `<button type="button" class="sg-add" data-sug="${esc(id)}"><span>${esc(IDX[id].name.replace(/^Salsa /, ""))}</span><b><span class="pl" aria-hidden="true">+</span>${fmt(IDX[id].price)}</b></button>`).join("")}</div>`;
  }
  if (!html){ hideSuggest(); return; }
  clearTimeout(sugOut); sugBox.classList.remove("out"); dock.classList.add("on");
  sugBox.innerHTML = html; document.body.classList.add("has-sug");
  if (sugBox.hidden){ sugBox.hidden = false; sugBox.classList.remove("in"); void sugBox.offsetWidth; sugBox.classList.add("in"); }
}

function renderCart(){
  const { count, sum, ls } = totals();
  cbadge.textContent = count; cbadge.hidden = count === 0;
  cartbtn.setAttribute("aria-label", count ? "Ver pedido: " + count + (count === 1 ? " producto, " : " productos, ") + fmt(sum) : "Ver pedido");
  cartbtn.title = count ? fmt(sum) : "";
  $("#lines").innerHTML = ls.length ? ls.map(l => `<div class="line">
      ${l.thumb ? `<img class="line-thumb" src="${esc(l.thumb)}" alt="" loading="lazy">` : `<div class="line-thumb ph" aria-hidden="true"></div>`}
      <div class="line-main"><b>${esc(l.it.name)}</b>${l.parts.map(p => `<small>${esc(p)}</small>`).join("")}<small>${fmt(l.price)} c/u</small></div>
      <div class="qty">
        <button type="button" data-dec="${esc(l.k)}" aria-label="Quitar uno de ${esc(l.it.name)}">−</button>
        <span aria-label="Cantidad">${l.qty}</span>
        <button type="button" data-inc="${esc(l.k)}" aria-label="Agregar uno de ${esc(l.it.name)}">+</button>
      </div>
      <div class="line-price"><b>${fmt(l.qty * l.price)}</b></div>
    </div>`).join("") + panelSuggest(ls) : `<p class="empty">Aún no agregas productos.</p>`;
  $("#total").textContent = fmt(sum);
  syncPay();
  $("#send").disabled = count === 0;
  document.querySelectorAll(".item").forEach(syncCard);
  if (count === 0){ hideSuggest(); if (drawer.classList.contains("on")) toggle(false); } else drawSuggest();
}

function toggle(open, focus){
  if (open) hideSuggest();
  drawer.classList.toggle("on", open);
  scrim.classList.toggle("on", open);
  document.body.classList.toggle("panel-open", open);
  drawer.inert = !open;
  if (open && focus) $("#close").focus();
  if (!open && focus) cartbtn.focus();
}

function feedback(id){
  const card = document.querySelector('.item[data-id="' + id + '"]'); if (!card) return;
  const stp = card.querySelector(".stp");
  if (!stp.hidden) pop(stp);
}

function upgrade(k){
  if (!cart[k]) return hideSuggest();
  const [id, o, , p] = k.split("|");
  cart[k]--; if (cart[k] <= 0) delete cart[k];
  const nk = [id, o, 1, p].join("|");
  cart[nk] = (cart[nk] || 0) + 1;
  curOffer = cart[k] > 0 ? { id, k, cat:CATOF[id] } : null;   /* si quedan unidades sin combo, la oferta sigue */
  save(); renderCart(); feedback(id); hideSuggest();
  $("#live").textContent = "Combo agregado: " + IDX[id].name;
}

function add(id, viaSuggestion, cOver){
  const it = IDX[id], s = S(id), card = document.querySelector('.item[data-id="' + id + '"]');
  const hadFocus = !!(card && document.activeElement && document.activeElement.classList.contains("add") && card.contains(document.activeElement));
  if (!viaSuggestion && it.pick && s.p < 0){
    const box = card.querySelector(".pick");
    card.querySelector(".pk-err").hidden = false;
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
    const first = box.querySelector("[data-pick]"); if (first) first.focus();
    return;
  }
  const o = it.options ? s.o : 0, p = it.pick ? s.p : -1;
  const c = cOver !== undefined ? cOver : ((PRE() && s.c && comboOf(it, o)) ? 1 : 0);
  const k = [id, o, c, p].join("|");
  cart[k] = (cart[k] || 0) + 1;
  save(); renderCart(); feedback(id);
  if (hadFocus){ const b = card.querySelector(".stp:not([hidden]) [data-inc]"); if (b) b.focus(); }
  pop(cartbtn); pop(cbadge);
  $("#live").textContent = "Agregado: " + it.name;
  if (viaSuggestion) drawSuggest();
  else if (POST() && !c && comboOf(it, o)){ hideSuggest(); setOffer(id, k); }
  else drawSuggest();
}

function change(k, d){
  cart[k] = (cart[k] || 0) + d;
  if (cart[k] <= 0) delete cart[k];
  save(); renderCart();
}

document.addEventListener("click", e => {
  const jump = e.target.closest("[data-jump]");
  if (jump){
    const el = document.getElementById(jump.dataset.jump);
    if (el) el.scrollIntoView({behavior: reduced ? "auto" : "smooth", block:"start"});
    return;
  }
  const t = e.target.closest("button"); if (!t) return;
  const card = t.closest(".item");
  if (card){ const cid = card.dataset.id; if (curSug && curSug.it && curSug.it.id !== cid) hideSuggest(); if (curOffer && curOffer.id !== cid) hideOffer(); }
  if (t.classList.contains("zoom")) return openLb(t);
  if (t.hasAttribute("data-sgx")) return hideSuggest();
  if (t.dataset.sug) return add(t.dataset.sug, true);
  if (t.dataset.upgrade) return upgrade(t.dataset.upgrade);
  if (t.hasAttribute("data-add") && card){
    const cid = card.dataset.id, ci = IDX[cid];
    if (SHEET() && hasSheet(ci, ci.options ? S(cid).o : 0)) return openSheet(cid);
    return add(cid);
  }
  if (t.hasAttribute("data-combo") && card){ const sc = S(card.dataset.id); sc.c = !sc.c; syncCard(card); return; }
  if (t.hasAttribute("data-sh-x")) return closeSheet();
  if (t.dataset.shC !== undefined && shCtx){ shCtx.c = +t.dataset.shC; drawSheet(); const f = $('[data-sh-c="' + shCtx.c + '"]'); if (f) f.focus(); return; }
  if (t.dataset.shEx !== undefined && shCtx){ const x = t.dataset.shEx, i = shCtx.ex.indexOf(x); if (i >= 0) shCtx.ex.splice(i, 1); else shCtx.ex.push(x); drawSheet(); const f = $('[data-sh-ex="' + x + '"]'); if (f) f.focus(); return; }
  if (t.hasAttribute("data-sh-add") && shCtx){ const sx = shCtx; closeSheet(); add(sx.id, false, sx.c); sx.ex.forEach(x => add(x, true)); return; }
  if (t.hasAttribute("data-opt") && card){
    const it = IDX[card.dataset.id], s = S(it.id);
    s.o = +t.dataset.opt; pressOnly(t); syncCard(card);
    return;
  }
  if (t.hasAttribute("data-pick") && card){
    S(card.dataset.id).p = +t.dataset.pick; pressOnly(t); swapPhoto(card);
    const er = card.querySelector(".pk-err"); if (er) er.hidden = true;
    syncCard(card);
    return;
  }
  if (t.dataset.inc){
    const k = t.dataset.inc, stp = t.closest(".stp");
    if (stp && card && SHEET()){ const p0 = k.split("|"); if (hasSheet(IDX[p0[0]], +p0[1])) return openSheet(p0[0]); }
    change(k, 1); pop(stp);
    if (stp && card && POST()){ const p = k.split("|"); if (+p[2] === 0 && comboOf(IDX[p[0]], +p[1])) setOffer(p[0], k); }   /* cada unidad nueva vuelve a ofrecer el combo */
    return;
  }
  if (t.dataset.dec){
    const inStp = t.closest(".stp");
    change(t.dataset.dec, -1);
    if (inStp && card && card.querySelector(".stp").hidden){ const a = card.querySelector(".add"); if (a) a.focus(); }
    return;
  }
});

cartbtn.addEventListener("click", () => toggle(!drawer.classList.contains("on"), true));
$("#close").addEventListener("click", () => toggle(false, true));
scrim.addEventListener("click", () => toggle(false, true));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!lb.hidden) return closeLb();
  if (shCtx) return closeSheet();
  if (drawer.classList.contains("on")) toggle(false, true);
});

/* ---------- Hoja: ¿solo o combo? ---------- */
let shCtx = null, shFrom = null;
const hasSheet = (it, o) => !!(comboOf(it, o) || it.extras);
function sheetTotal(){
  const it = IDX[shCtx.id], s = S(it.id), o = it.options ? s.o : 0, cb = comboOf(it, o);
  return unitPrice(it, o, false, s.p) + (shCtx.c && cb ? cb.extra : 0) + shCtx.ex.reduce((a, x) => a + IDX[x].price, 0);
}
function drawSheet(){
  const it = IDX[shCtx.id], s = S(it.id), o = it.options ? s.o : 0, cb = comboOf(it, o);
  const lab = [it.options ? it.options[o].label : "", it.pick && s.p >= 0 ? (it.pick.short || "Salsa") + " " + it.pick.list[s.p] : ""].filter(Boolean).join(" · ");
  const base = unitPrice(it, o, false, s.p);
  const radios = cb ? `<div role="radiogroup" aria-label="¿Cómo lo quieres?" class="sh-g">
      <button type="button" class="sh-opt" role="radio" aria-checked="${shCtx.c === 0}" data-sh-c="0"><span class="rd" aria-hidden="true"></span><span class="tx"><b>Solo ${esc(it.name)}</b></span><i>${fmt(base)}</i></button>
      <button type="button" class="sh-opt" role="radio" aria-checked="${shCtx.c === 1}" data-sh-c="1"><span class="rd" aria-hidden="true"></span><span class="tx"><b>Hazla combo</b><small>${esc(cb.desc.replace(/^\+\s*/, ""))}</small></span><i>${fmt(base + cb.extra)}</i></button>
    </div>` : "";
  const ex = it.extras ? `<div class="sh-ex" role="group" aria-label="${esc(it.extras.label)}"><p class="sh-lab">${esc(it.extras.label)} <small>(opcional)</small></p>
      <div class="exg">${it.extras.ids.map(id => { const on = shCtx.ex.indexOf(id) >= 0;
        return `<button type="button" class="sh-chk" role="checkbox" aria-checked="${on}" data-sh-ex="${esc(id)}"><span class="tx"><b>${esc(IDX[id].name)}</b><small>+ ${fmt(IDX[id].price)}</small></span><span class="bx" aria-hidden="true">${on ? "✓" : "+"}</span></button>`; }).join("")}</div></div>` : "";
  $("#sheet").innerHTML = `<div class="sh-h"><div><b id="sh-t">${esc(it.name)}</b>${lab ? `<span>${esc(lab)}</span>` : ""}</div><button class="x" type="button" data-sh-x aria-label="Cerrar">✕</button></div>
    ${radios}${ex}
    <button type="button" class="add sh-add" data-sh-add>+ Agregar · ${fmt(sheetTotal())}</button>`;
}
function openSheet(id){
  const it = IDX[id], s = S(id);
  if (it.pick && s.p < 0) return add(id);                              /* mismo aviso de "elige una opción" */
  shCtx = { id, c:0, ex:[] }; shFrom = document.activeElement; drawSheet();
  $("#shbd").hidden = false; const sh = $("#sheet"); sh.hidden = false; sh.scrollTop = 0; sh.classList.remove("in"); void sh.offsetWidth; sh.classList.add("in");
  const f = $('[data-sh-c="0"]') || $("[data-sh-add]"); if (f) f.focus();
}
function closeSheet(){ shCtx = null; $("#sheet").hidden = true; $("#shbd").hidden = true; if (shFrom && shFrom.focus) shFrom.focus(); }
$("#shbd").addEventListener("click", closeSheet);

/* ---------- Foto ampliada ---------- */
const lb = $("#lb"); let lbFrom = null;
function openLb(btn){
  const card = btn.closest(".item"), it = IDX[card.dataset.id], img = btn.querySelector("img");
  $("#lbi").src = img.currentSrc || img.src; $("#lbi").alt = it.name;
  $("#lbc").innerHTML = esc(it.name) + (it.desc ? "<small>" + esc(it.desc) + "</small>" : "");
  lbFrom = btn; lb.hidden = false; document.body.style.overflow = "hidden"; $("#lbx").focus();
}
function closeLb(){ lb.hidden = true; document.body.style.overflow = ""; if (lbFrom) lbFrom.focus(); }
$("#lbx").addEventListener("click", closeLb);
lb.addEventListener("click", e => { if (e.target === lb || e.target.tagName === "FIGURE") closeLb(); });

/* ---------- Datos del cliente (se recuerdan para la próxima vez) ---------- */
const PROFILE = "carta_cliente_v1";
try {
  const p = JSON.parse(localStorage.getItem(PROFILE)) || {};
  if (p.name) $("#cname").value = p.name;
  if (p.addr) $("#caddr").value = p.addr;
} catch(e){}

/* Datos de transferencia (si están en CONFIG) */
const PAY = CONFIG.transferencia || {};
const hasPay = !!PAY.numeroCuenta;
const payRows = [["Titular", PAY.titular], ["RUT", PAY.rut], ["Banco", PAY.banco], ["Tipo de cuenta", PAY.tipoCuenta], ["N° de cuenta", PAY.numeroCuenta], ["Correo", PAY.email]].filter(r => r[1]);
if (hasPay){
  $("#pay").hidden = false;
  $("#payRows").innerHTML = payRows.map(r => `<div><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join("");
  $("#copyPay").addEventListener("click", async () => {
    const txt = payRows.map(r => r[0] + ": " + r[1]).join("\n"), btn = $("#copyPay");
    try { await navigator.clipboard.writeText(txt); btn.textContent = "Copiado ✓"; }
    catch(e){ btn.textContent = "No se pudo copiar"; }
    setTimeout(() => btn.textContent = "Copiar datos", 1800);
  });
}

const tipo = () => document.querySelector('input[name="tipo"]:checked').value;
function syncPay(){
  const t = document.getElementById("payT"); if (!t) return;
  const r = document.querySelector('input[name="tipo"]:checked');
  const delivery = !r || r.value === "delivery", sum = totals().sum;
  t.innerHTML = delivery
    ? `Cuando te confirmemos el delivery, transfiere <b>${fmt(sum)}</b> + delivery a:`
    : `Transfiere <b>${fmt(sum)}</b> a:`;
}
function syncTipo(){
  const d = tipo() === "delivery";
  $("#addrWrap").style.display = d ? "" : "none";
  const dn = $("#dnote");
  dn.textContent = (d && delivRange) ? "+ Delivery entre " + delivRange + ". Nuestro equipo te confirma el valor exacto." : "";
  dn.hidden = !dn.textContent;
  const os = $("#orderStep span");
  if (os) os.textContent = d
    ? "Envía tu pedido. Te confirmamos delivery y pago; mandas el comprobante y preparamos."
    : "Envía tu pedido. Realizas el pago, mandas el comprobante y preparamos.";
  $("#steps").innerHTML = "";
  syncPay();
}
document.querySelectorAll('input[name="tipo"]').forEach(r => r.addEventListener("change", syncTipo));
syncTipo();

$("#send").addEventListener("click", () => {
  const { sum, ls } = totals(); if (!ls.length) return;
  const name = $("#cname").value.trim(), addr = $("#caddr").value.trim(), note = $("#cnote").value.trim();
  const delivery = tipo() === "delivery", err = $("#err");
  if (!name){ err.textContent = "Escribe tu nombre."; $("#cname").focus(); return; }
  if (delivery && addr.length < 5){ err.textContent = "Escribe tu dirección para el delivery."; $("#caddr").focus(); return; }
  err.textContent = "";
  try { localStorage.setItem(PROFILE, JSON.stringify({ name, addr })); } catch(e){}

  const txt = [
    "Hola " + CONFIG.nombre + " 👋 quiero hacer un pedido:",
    "",
    ...ls.map(l => "• " + l.qty + " × " + l.it.name + (l.parts.length ? " (" + l.parts.join(" · ") + ")" : "") + " — " + fmt(l.qty * l.price)),
    "",
    "*Total: " + fmt(sum) + "*",
    delivery ? "*Dirección:* " + addr : "*Retiro en local*",
    "*Nombre:* " + name,
    note ? "*Notas:* " + note : null,
    "",
    delivery ? "*Pago:* transferencia previa (espero tu confirmación del delivery y te envío el comprobante)"
             : (hasPay ? "*Pago:* transferencia previa (te envío el comprobante)" : "*Pago:* transferencia previa (¿me envías los datos?)")
  ].filter(x => x !== null).join("\n");
  window.open("https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(txt), "_blank", "noopener");
});


/* ---------- Opciones de diseño (solo en la versión de prueba) ---------- */
if (CONFIG.opciones){
  const G = [
    ["foto", "Foto", [["lista","Lista"],["hero","Foto arriba"],["grid","Grilla de 2"]]],
    ["tipografia", "Tipografía", [["actual","Actual"],["contrast","Contraste"],["weight","Con peso"]]],
    ["cta", "Cómo ofrecer el combo", [["actual","Después de agregar"],["toggle","Interruptor"],["tag","Etiqueta en la foto"],["sheet","Hoja al agregar"]]],
    ["desc", "Descripción del plato", [["full","Completa"],["one","1 línea"],["none","Sin"]]]
  ];
  const labBtn = document.createElement("button"); labBtn.className = "labbtn"; labBtn.type = "button"; labBtn.textContent = "Opciones de diseño"; labBtn.setAttribute("aria-expanded", "false");
  const labBox = document.createElement("div"); labBox.className = "lab"; labBox.hidden = true;
  const draw = () => { labBox.innerHTML = G.map(([k, t, o]) => `<p class="lab-t">${t}</p><div class="lab-g${o.length === 4 ? " two" : ""}">${o.map(([v, n]) => `<button type="button" data-lab="${k}:${v}" aria-pressed="${DESIGN[k] === v}">${n}</button>`).join("")}</div>`).join(""); };
  draw();
  labBtn.addEventListener("click", () => { labBox.hidden = !labBox.hidden; labBtn.setAttribute("aria-expanded", String(!labBox.hidden)); });
  labBox.addEventListener("click", e => {
    const b = e.target.closest("[data-lab]"); if (!b) return;
    const [k, v] = b.dataset.lab.split(":"); DESIGN[k] = v; applyDesign(); hideOffer(); renderCart();
    try { localStorage.setItem("carta_diseno_v1", JSON.stringify(DESIGN)); } catch(_){}
    draw();
  });
  document.body.append(labBox, labBtn);
}

renderCart();
</script>
