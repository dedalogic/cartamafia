<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MAFIA · Fintoc Test</title>

  <script src="https://sdk.mercadopago.com/js/v2"></script>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#0c0c0c;
      color:#fff;
      font-family:Arial,sans-serif;
    }

    .box{
      width:min(360px,calc(100% - 32px));
      text-align:center;
    }

    button{
      width:100%;
      min-height:54px;
      border:0;
      border-radius:14px;
      background:#c8102e;
      color:#fff;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    #status{
      margin-top:18px;
      color:#aaa;
      font-size:13px;
      line-height:1.5;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>MAFIA</h1>

  <button id="test">
    Probar transferencia bancaria
  </button>

  <div id="status">
    Sandbox Fintoc
  </div>
</div>

<script>
const statusEl = document.getElementById("status");

async function getConfig(){
  const r = await fetch("/.netlify/functions/mp-test-config");
  const data = await r.json();

  if(!data.enabled || !data.publicKey){
    throw new Error("Mercado Pago TEST no está habilitado");
  }

  return data;
}

async function start(){
  try{
    statusEl.textContent = "Cargando Fintoc...";

    const config = await getConfig();

    const mp = new MercadoPago(config.publicKey);

    const fintoc = mp.fintoc({
      sandbox: true
    });

    console.log("Fintoc sandbox:", fintoc);

    statusEl.textContent =
      "Fintoc sandbox se inicializó correctamente. Revisa la consola.";

  }catch(err){
    console.error(err);
    statusEl.textContent =
      "Error: " + (err.message || err);
  }
}

document
  .getElementById("test")
  .addEventListener("click", start);
</script>

</body>
</html>
