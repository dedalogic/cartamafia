[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["menu-data.js", "local-defaults.js"]

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/caja/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/menu-data.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/local-defaults.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/local/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/delivery/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/carta"
  to = "/local/"
  status = 301
  force = true

[[redirects]]
  from = "/carta/*"
  to = "/local/"
  status = 301
  force = true
