<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>MAFIA · Admin</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pesto Mafio";src:url("/PestoMafio.ttf") format("truetype"),url("/fonts/PestoMafio.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
:root{--amber:#f6b400;--amberbg:#fff4cf;--amberdk:#8a5a00;--bg:#fff;--bg2:#f5f5f4;--line:#e7e5e4;--text:#141414;--muted:#6f6b66;--accent:#c8102e;--disp:"Pesto Mafio","Playfair Display",Georgia,serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--r:12px}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:.04em}
.rec{margin:0 0 18px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fffbe9}.rec b{font-size:14px}.rec1{display:flex;gap:8px;margin-top:10px}.rec1 input{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.rec1 button{height:44px;padding:0 18px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:700;cursor:pointer}.rec2{margin-top:10px;height:40px;padding:0 14px;border:1.5px solid #111;border-radius:12px;background:#fff;font-weight:700;cursor:pointer}.rec2:disabled{opacity:.5}.uact{display:flex;gap:8px;align-items:center}.chk{height:36px;padding:0 14px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700;cursor:pointer}.chk:disabled{opacity:.5}.chkmsg{margin:6px 0 0;font-size:13px}.rec .m{margin:8px 0 0;font-size:13px;color:var(--muted)}
.none{padding:40px 10px;text-align:center;color:var(--muted);font-size:14px}

/* acceso */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:min(340px,100%);display:grid;gap:12px;text-align:center}
.login .mark{font-family:var(--disp);font-size:54px;letter-spacing:.05em;line-height:1;margin-bottom:6px}
.login p.sub{margin:0 0 8px;color:var(--muted);font-size:14px}
.login input{height:50px;border-radius:var(--r);border:1px solid var(--line);background:#fff;padding:0 16px;font-size:16px}
.login input:focus{outline:2px solid var(--text);outline-offset:1px}
.err{min-height:18px;margin:0;color:var(--accent);font-size:13px}
.btn{border:0;border-radius:var(--r);background:var(--text);color:#fff;font-weight:700;font-size:16px;padding:0 20px;min-height:50px}
.btn:disabled{opacity:.4}

/* estructura */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;height:58px;padding:0 10px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ico{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:10px;color:var(--text)}
.ico:hover{background:var(--bg2)}
.top h1{margin:0;flex:1;font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .carta{display:inline-flex;align-items:center;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s}
.drawer{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(290px,86vw);background:#fff;border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .22s;display:flex;flex-direction:column;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
.menu-open .drawer{transform:none}.menu-open .scrim{opacity:1;pointer-events:auto}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 18px}
.dhead .mark{font-family:var(--disp);font-size:32px;letter-spacing:.05em;line-height:1}
.nav{display:grid;gap:2px}
.nav a,.nav button{display:flex;align-items:center;gap:14px;width:100%;min-height:46px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:15px;font-weight:600;text-align:left}
.nav a:hover,.nav button:hover{background:var(--bg2);color:var(--text)}
.nav .on{background:var(--bg2);color:var(--text)}
.nav .sep{height:1px;background:var(--line);margin:10px 4px}
.nav .mode{justify-content:space-between;color:var(--text)}
.nav .mode i{position:relative;flex:0 0 44px;height:26px;border-radius:99px;background:var(--line);transition:background .2s}
.nav .mode i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.nav .mode[aria-checked="true"] i{background:var(--red,#C8102E)}
.nav .mode[aria-checked="true"] i::after{transform:translateX(18px)}
.nav .badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.foot{margin-top:auto}
main{padding:20px 16px 110px;max-width:920px;margin:0 auto}
main.wide{max-width:1240px}

/* inicio */
.hello{margin:2px 0 18px}.hello h2{margin:0;font-size:34px;line-height:1.05}.hello p{margin:6px 0 0;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.stat{padding:14px 14px;border-left:1px solid var(--line)}.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:28px;line-height:1;letter-spacing:.02em}
.stat span{display:block;margin-top:6px;font-size:12px;color:var(--muted);line-height:1.25}
.stat.hot b,.stat.bad b{color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-height:140px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);color:var(--text);transition:border-color .12s,background .12s}
.card:hover{border-color:#b9b5b0;background:#fcfcfb}
.card .ci{color:var(--text)}.card .ci svg{width:26px;height:26px}
.card h3{margin:0;font-family:var(--disp);font-weight:400;font-size:22px;letter-spacing:.04em;line-height:1.05}
.card p{margin:5px 0 0;font-size:13px;color:var(--muted);line-height:1.3}
.card .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#bbb}
.card .dot.on{background:var(--text)}.card .dot.off{background:#bbb}
.card .tag{position:absolute;top:14px;right:14px;min-width:24px;height:24px;padding:0 8px;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.card.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.view-h{margin:0 0 16px}.view-h p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}

/* productos */
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.search input{width:100%;height:48px;border-radius:var(--r);border:1px solid var(--line);background:#fff;padding:0 14px 0 44px;font-size:16px}
.search input:focus{outline:2px solid var(--text);outline-offset:1px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:#fff}
.cat{margin:20px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;background:#fff}
.ph{position:relative;aspect-ratio:4/3;background:var(--bg2);cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent}
.ph .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:36px;color:#c9c5bf}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .2s,filter .2s}
.tile.off .ph img{filter:grayscale(1);opacity:.3}
.sold{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:6px 14px;border-radius:999px;background:var(--text);color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 12px;flex:1}
.tb b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.state{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.state.off{color:var(--text);font-weight:700}
.subs{border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:2px 8px 2px 12px}.prow span{font-size:14px;color:var(--muted)}
.sw{position:relative;display:block;flex:none;width:52px;height:44px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;left:0;top:9px;width:52px;height:26px;border-radius:999px;background:#d6d3ce;transition:.18s;pointer-events:none}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.18s}
.sw input:checked+i{background:var(--text)}.sw input:checked+i:after{transform:translateX(26px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}.sw input:disabled+i{opacity:.4}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
.savebar span{flex:1;font-size:14px;font-weight:600}.savebar .btn{min-width:150px}


/* carta local */
.lnote{margin:0 0 14px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.lnote summary{list-style:none;cursor:pointer;padding:14px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.lnote summary::-webkit-details-marker{display:none}.lnote summary span{color:var(--muted);font-weight:400}
.lnote .nb{display:grid;gap:10px;padding:0 14px 14px}.lnote label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.lnote input,.lf input,.lf textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;font-size:16px;min-height:46px}
.lf input,.lf textarea,.lnote input{color:var(--text)}
.lf textarea{padding:10px 12px;min-height:84px;resize:vertical}
.ledit{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline;padding:6px 0;min-height:32px;text-align:left}
.tag2{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--accent)}
.lsh{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.lsh>div{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}
.lsh h3{margin:0;font-family:var(--disp);font-weight:400;font-size:24px;letter-spacing:.04em}
.lf{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.lph{display:flex;gap:12px;align-items:center}.lph img{width:96px;height:80px;object-fit:cover;border-radius:12px;background:var(--bg2)}
.lph div{display:grid;gap:6px}
.btn.alt{background:#fff;color:var(--text);border:1px solid var(--line);min-height:44px;font-size:14px}


/* mapa */
.mp-help{margin:4px 0 0;font-size:13px;color:var(--muted)}
.mp-map{height:min(62vh,560px);min-height:340px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.mp-st{display:flex;flex-wrap:wrap;gap:18px;margin:12px 0}.mp-st b{display:block;font-family:var(--disp);font-weight:400;font-size:28px;line-height:1}.mp-st span{font-size:12px;color:var(--muted)}
.mp-prog{margin:10px 0;font-size:13px;color:var(--muted)}
.mp-top{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.mp-top h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mp-r{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}.mp-r span:first-child{flex:1;text-transform:capitalize}
.mp-r i{font-style:normal;font-weight:700}.mp-bar{flex:0 0 90px;height:8px;border-radius:4px;background:var(--bg2);overflow:hidden}.mp-bar u{display:block;height:100%;background:var(--accent)}
.mp-fail{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.5}
.leaflet-container{font-family:var(--sans)}

/* pago */
.pay{display:grid;gap:12px}
.big{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.big .t{flex:1}.big h3{margin:0;font-family:var(--disp);font-weight:400;font-size:24px;letter-spacing:.04em}
.big p{margin:6px 0 0;font-size:14px;line-height:1.4;color:var(--muted)}
.note{padding:14px 16px;border-radius:var(--r);background:var(--bg2);font-size:14px;line-height:1.45}
.hint{margin:14px 2px 0;font-size:12px;color:var(--muted);line-height:1.5}

/* sin terminar */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{height:44px;border:0;background:none;color:var(--muted);font-weight:600;font-size:15px;position:relative;padding:0}
.tabs button[aria-pressed=true]{color:var(--text)}.tabs button[aria-pressed=true]:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--text)}
.ul{margin-top:6px}
.ui{padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.ui .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.ui b{font-size:16px}
.why{display:block;margin-top:2px;color:var(--muted);font-size:13px;font-weight:600}.why.rej{color:var(--accent)}
.ui .m{color:var(--muted)}.ui .who{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.call,.pill{display:inline-flex;align-items:center;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:14px;flex:none}
.toast{border-radius:16px!important;line-height:1.4;max-width:min(520px,90vw)!important;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:var(--text);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;max-width:90vw}

/* pedidos */
.alertbar{display:flex;align-items:center;gap:10px;margin:0 0 20px;padding:12px 14px;border-radius:var(--r);background:#fff;color:var(--text);border:1px solid var(--accent);font-weight:700;font-size:15px;cursor:pointer;width:100%;text-align:left}
.alertbar .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.ord{display:grid;grid-template-columns:1fr;gap:16px}
.ord.has-sel .ocol{display:none}.ord:not(.has-sel) .dcol{display:none}
.otabs{display:flex;gap:20px;overflow-x:auto;margin:0 -16px;padding:0 16px;border-bottom:1px solid var(--line);scrollbar-width:none}.otabs::-webkit-scrollbar{display:none}
.otab{flex:none;height:46px;padding:0;border:0;background:none;color:var(--muted);font-weight:600;font-size:15px;position:relative}
.otab b{margin-left:6px;font-weight:600}
.otab[aria-pressed=true]{color:var(--text)}.otab[aria-pressed=true]:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--text)}
.otab.hot b{color:var(--accent);font-weight:800}
.soundoff{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;margin:12px 0 0;border:1px dashed #cfcac4;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:14px}
.olist{display:block}
.orow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;padding:13px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;border-left:2px solid transparent}
.orow:hover{background:var(--bg2)}.orow[aria-current=true]{background:var(--bg2);border-left-color:var(--text)}
.orow .n{font-family:var(--disp);font-size:24px;letter-spacing:.04em;line-height:1}
.orow .t{font-weight:700;font-size:16px;text-align:right}
.orow .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .w{font-size:12px;color:var(--muted);text-align:right}
.orow.new .w{color:var(--accent);font-weight:700}
.orow.new .n:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:5px}

/* detalle */
.d-back{display:inline-flex;align-items:center;height:40px;margin:-4px 0 4px -6px;padding:0 8px;border:0;background:none;color:var(--muted);font-size:14px;font-weight:600}
.d-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.d-num{font-family:var(--disp);font-size:42px;letter-spacing:.04em;line-height:1}
.d-meta{color:var(--muted);font-size:14px}.d-meta b{color:var(--text);font-weight:700}
.d-sec{padding:14px 0;border-bottom:1px solid var(--line)}
.d-cust{display:flex;align-items:center;gap:10px}
.d-cust .cn{flex:1;min-width:0}.d-cust b{display:block;font-size:16px;font-weight:700}.d-cust span{display:block;margin-top:2px;color:var(--muted);font-size:14px}
.d-lbl{display:block;margin-bottom:4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.d-addr{margin-top:12px;font-size:15px;font-weight:600;line-height:1.35}
.d-note{margin-top:12px;padding-left:12px;border-left:2px solid var(--text);font-size:14px;line-height:1.4}
.d-items{padding:6px 0 0}
.it{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.it .q{font-weight:700;font-size:15px}.it .nm{font-size:15px;font-weight:600}
.it small{display:block;margin-top:2px;color:var(--muted);font-size:13px;line-height:1.35;font-weight:400}.it .p{font-size:14px;color:var(--muted)}
.d-tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px}
.d-tot span{font-size:13px;color:var(--muted);font-weight:600}
.d-tot b{font-family:var(--disp);font-weight:400;font-size:30px;letter-spacing:.03em}.d-tot small{display:block;font-size:12px;color:var(--muted);text-align:right}
.d-warn{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);font-size:13px;font-weight:600}
.d-act{position:sticky;bottom:0;margin:14px -16px -110px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.d-hint{margin:0 0 8px;color:var(--muted);font-size:13px;text-align:center}
.go{display:block;width:100%;height:54px;border:0;border-radius:var(--r);background:var(--text);color:#fff;font-size:16px;font-weight:700}
.sec{display:flex;gap:8px;margin-top:8px}
.sec>*{flex:1;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-size:14px;font-weight:600}
.wbox{margin-top:14px}.wbox h3{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---- amarillo para lo que hay que aceptar ---- */

.grid{gap:14px}

.sch-link{border:0;background:none;padding:10px 4px;font-weight:700;font-size:14px;color:var(--text);text-decoration:underline}.sch-link:disabled{opacity:.35}.sch-link.danger{color:var(--accent)}
.sch-l{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:16px 0 6px}
.sch-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;background:#fff}
.sch-days{display:flex;gap:6px}.sch-days button{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700;font-size:14px;color:var(--muted)}.sch-days button.on{background:var(--text);border-color:var(--text);color:#fff}
.sch-t{display:flex;gap:8px}.sch-cs{display:flex;gap:8px;flex-wrap:wrap}
.sch-c{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;font-size:14px;font-weight:600}.sch-c.on{background:var(--text);border-color:var(--text);color:#fff}.sch-c i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--amber);color:#111;font-size:12px;font-weight:800;display:grid;place-items:center}
.sch-save{width:100%;margin-top:20px}.sch-ops{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
</style>
</head>
<body>

<div class="login" id="loginWrap">
  <form id="login" autocomplete="off">
    <div class="mark">MAFIA</div>
    <p class="sub">Panel de administración</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="Clave" aria-label="Clave de administrador" required>
    <button class="btn" type="submit">Entrar</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <header class="top">
    <button class="ico menu" id="menuBtn" type="button" aria-label="Abrir menú" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1 class="disp" id="title">Inicio</h1>
    <button class="ico" id="soundBtn" type="button" aria-label="Sonido de alertas" aria-pressed="false"></button>
    <a class="carta" href="/delivery/" target="_blank" rel="noopener">Ver carta</a>
  </header>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Menú">
    <div class="dhead"><span class="mark">MAFIA</span><button class="ico menu" id="closeBtn" type="button" aria-label="Cerrar menú"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="nav" id="nav"></nav>
    <div class="nav foot"><div class="sep"></div><button type="button" id="logout"><svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>Cerrar sesión</button></div>
  </aside>

  <main id="main"><button class="alertbar" id="alertbar" type="button" hidden></button><div id="view"></div></main>
  <div class="savebar" id="savebar" hidden><span>Cambios sin guardar</span><button class="btn" id="saveBtn" type="button">Guardar cambios</button></div>
</div>
<div class="toast" id="toast" role="alert" hidden></div>

<script>
const API = { av:"/.netlify/functions/menu-availability", pay:"/.netlify/functions/pay-switch", unp:"/.netlify/functions/orders-unpaid", ord:"/.netlify/functions/orders-list", rep:"/.netlify/functions/orders-report", loc:"/.netlify/functions/local-menu", geo:"/.netlify/functions/orders-geo", upd:"/.netlify/functions/orders-update", loy:"/.netlify/functions/loyalty-admin", sch:"/.netlify/functions/schedule" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clp = n => "$" + new Intl.NumberFormat("es-CL").format(n || 0);
const when = d => new Date(d).toLocaleString("es-CL", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
const I = {
  menu:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>',
  orders:'<svg viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v17l-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6"/></svg>',
  box:'<svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  card:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  menuBook:'<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>',
  bell:'<svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15zM10 21h4"/></svg>',
  bellOff:'<svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 9-5.2M18 11v6l1.5 2H8M10 21h4M3 3l18 18"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'
};
const VIEWS = { inicio:"Inicio", pedidos:"Pedidos", resumen:"Resumen", productos:"Carta online", "carta-local":"Carta local", horarios:"Horarios", pago:"Pago online", "sin-terminar":"Sin terminar", clientes:"Clientes" };

let pass = "", role = "", dirty = false, saving = false;
let simple = false; try { simple = localStorage.getItem("mafia_admin_simple") === "1"; } catch(e){}
const canAdmin = () => role === "admin";           /* tiene clave de administrador */
const isAdmin = () => role === "admin" && !simple; /* ve todo, salvo que active el modo simple */
const S = { loy:null, loyAge:"all", dash:null, dashDays:7, orders:[], known:null, tab:"nuevo", sel:null, msgOpen:null, sig:"", catalog:[], dp:new Set(), dop:{}, pay:null, unp:null, unpDays:7, today:null, q:"", cat:"all" };

async function call(url, body){
  const r = await fetch(url + "?t=" + Date.now(), { method:"POST", cache:"no-store", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ password:pass, ...body }) });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw Object.assign(new Error(d.error || "No se pudo completar"), { status:r.status });
  return d;
}
const toast = (t, ms = 3500) => { const el = $("#toast"); el.textContent = t; el.hidden = !t; if (t) setTimeout(() => el.hidden = true, ms); };
function setState(d){ S.dp = new Set(d.disabledProducts || []); S.dop = {}; Object.entries(d.disabledOptions || {}).forEach(([id, v]) => S.dop[id] = new Set((v || []).map(String))); }

/* ---------- menú ---------- */
function drawNav(){
  const cur = route(), n = S.today ? S.today.nuevos : 0, A = isAdmin();
  const item = (id, ico, label, extra = "") => `<a href="#/${id}" class="${cur === id ? "on" : ""}">${ico}${label}${extra}</a>`;
  $("#nav").innerHTML =
    item("inicio", I.home, "Inicio") +
    item("pedidos", I.orders, "Pedidos", n ? `<span class="badge">${n}</span>` : "") +
    item("productos", I.box, "Carta online") +
    (canAdmin() ? item("carta-local", I.menuBook, "Carta local") : "") +
    (A ? item("resumen", I.chart, "Resumen") : "") +
    (A ? item("horarios", I.clock, "Horarios") : "") +
    (A ? item("clientes", I.orders, "Clientes") : "") +
    (A ? item("pago", I.card, "Pago online") + item("sin-terminar", I.clock, "Compras sin terminar", S.unp && S.unp.unpaid.some(x => x.review) ? '<span class="badge">!</span>' : "") : "") +
    `<div class="sep"></div><a href="/delivery/" target="_blank" rel="noopener">${I.menuBook}Ver carta online</a>` + (A ? `<a href="/local/" target="_blank" rel="noopener">${I.menuBook}Ver carta del local</a>` : "") +
    (canAdmin() ? `<div class="sep"></div><button type="button" class="mode" id="modeSw" role="switch" aria-checked="${simple}">Modo simple<i></i></button>` : "");
  const sw = $("#modeSw");
  if (sw) sw.onclick = () => { simple = !simple; try { localStorage.setItem("mafia_admin_simple", simple ? "1" : "0"); } catch(e){} if (isAdmin()){ loadPay(); loadUnpaid(); } render(); };
}
const openMenu = on => { document.body.classList.toggle("menu-open", on); $("#menuBtn").setAttribute("aria-expanded", on); };
$("#menuBtn").onclick = () => openMenu(true);
$("#closeBtn").onclick = $("#scrim").onclick = () => openMenu(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") openMenu(false); });

/* ---------- vistas ---------- */
const route = () => { const h = (location.hash || "").replace(/^#\/?/, ""); return VIEWS[h] && (h !== "carta-local" || canAdmin()) && (isAdmin() || (h !== "pago" && h !== "sin-terminar" && h !== "resumen" && h !== "horarios" && h !== "clientes")) ? h : "inicio"; };
function render(){
  const v = route(); $("#title").textContent = VIEWS[v]; document.title = "MAFIA · " + VIEWS[v];
  $("#main").classList.toggle("wide", v === "pedidos");
  ({ inicio:vHome, pedidos:vOrders, resumen:vDash, productos:vProducts, "carta-local":vLocal, horarios:vSched, pago:vPay, "sin-terminar":vUnpaid, clientes:vClients })[v]();
  syncAlert();
  $("#savebar").hidden = !((v === "productos" || v === "carta-local") && dirty);
  drawNav(); openMenu(false); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

function pic(id, k){ const w = S.catalog.filter(x => x.img); const f = S.catalog.find(x => x.id === id && x.img) || w[k % Math.max(1, w.length)]; return f ? f.img : ""; }
function tile(href, title, sub, img, extra = "", attrs = ""){
  return `<a class="card img" href="${href}" ${attrs}>${img ? `<img class="bg" src="${esc(img)}" alt="" onerror="this.remove()">` : ""}<span class="shade"></span>${extra}<div class="ct"><h3>${title}</h3><p>${sub}</p></div></a>`;
}
function vHome(){
  const t = S.today, off = S.catalog.filter(x => S.dp.has(x.id)).length, p = S.pay, A = isAdmin(), n = t ? t.nuevos : 0;
  $("#view").innerHTML = `
    <div class="hello"><h2 class="disp">Hola</h2><p>${new Date().toLocaleDateString("es-CL", { weekday:"long", day:"numeric", month:"long" })}</p></div>
    <div class="stats">
      <div class="stat ${n ? "hot" : ""}"><b>${t ? n : "–"}</b><span>Por aceptar</span></div>
      <div class="stat"><b>${t ? t.n : "–"}</b><span>Pedidos<br>últimas 24 h</span></div>
      ${A ? `<div class="stat"><b>${t ? clp(t.total) : "–"}</b><span>Vendido<br>últimas 24 h</span></div>` : `<div class="stat"><b>${off}</b><span>Productos<br>agotados</span></div>`}
    </div>
    <div class="grid">
      ${tile("#/pedidos", "Pedidos", n ? n + (n === 1 ? " pedido por aceptar" : " pedidos por aceptar") : "Sin pedidos por aceptar", pic("combo-mafioso", 0), n ? `<span class="tag">${n}</span>` : "")}
      ${tile("#/productos", "Carta online", off ? off + (off === 1 ? " agotado" : " agotados") : "Todo disponible", pic("pepperoni", 1))}
      ${canAdmin() ? tile("#/carta-local", "Carta local", "Agotados y precios del local", pic("combo-del-don", 6)) : ""}
      ${A ? tile("#/resumen", "Resumen", "Ventas y productos más vendidos", pic("combo-del-don", 2)) : ""}
      ${A ? tile("#/pago", "Pago online", `<span class="dot ${p && p.online ? "on" : ""}"></span>${p ? (p.online ? "Encendido" : "Apagado") : "…"}`, pic("combo-famiglia", 3)) : ""}
      ${A ? tile("#/sin-terminar", "Sin terminar", S.unp ? S.unp.unpaid_count + " no pagaron en " + S.unp.days + " días" : "Quién no completó su compra", pic("palitos", 4)) : ""}
      ${tile("/delivery/", "Ver carta online", "Como la ve el cliente", pic("margarita", 5), "", 'target="_blank" rel="noopener"')}
    </div>`;
}
function vProducts(){
  const cats = [...new Set(S.catalog.map(x => x.category))], offN = S.catalog.filter(x => S.dp.has(x.id)).length;
  $("#view").innerHTML = `
    <div class="view-h"><p>Carta <b>online</b> (somosmafia.cl/delivery). Toca la foto para marcar un producto como agotado. Se oculta apenas guardes.</p></div>
    <div class="search">${I.search}<input id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto" value="${esc(S.q)}"></div>
    <div class="chips" id="chips">
      <button class="chip" type="button" data-c="all" aria-pressed="${S.cat === "all"}">Todo</button>
      <button class="chip warn" type="button" data-c="off" aria-pressed="${S.cat === "off"}">Agotados${offN ? " · " + offN : ""}</button>
      ${cats.map(c => `<button class="chip" type="button" data-c="${esc(c)}" aria-pressed="${S.cat === c}">${esc(c)}</button>`).join("")}
    </div>
    <div id="plist"></div>`;
  $("#q").oninput = e => { S.q = e.target.value; drawProducts(); };
  $("#chips").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; S.cat = b.dataset.c; [...$("#chips").children].forEach(x => x.setAttribute("aria-pressed", x === b)); drawProducts(); };
  $("#plist").onclick = e => { const t = e.target.closest("[data-tap]"); if (!t) return; const cb = [...document.querySelectorAll("[data-p]")].find(x => x.dataset.p === t.dataset.tap); if (cb){ cb.checked = !cb.checked; cb.dispatchEvent(new Event("change", { bubbles:true })); } };
  $("#plist").onchange = e => {
    const p = e.target.closest("[data-p]"), o = e.target.closest("[data-o]");
    if (p){ p.checked ? S.dp.delete(p.dataset.p) : S.dp.add(p.dataset.p); }
    else if (o){ const id = o.dataset.o, i = o.dataset.i; S.dop[id] = S.dop[id] || new Set(); o.checked ? S.dop[id].delete(i) : S.dop[id].add(i); }
    else return;
    dirty = true; $("#savebar").hidden = false; drawProducts(true);
  };
  drawProducts();
}
function drawProducts(keep){
  const q = S.q.trim().toLowerCase(), box = $("#plist"); if (!box) return;
  const y = window.scrollY;
  let items = S.catalog.filter(x => (S.cat === "all" || (S.cat === "off" ? S.dp.has(x.id) : x.category === S.cat)) && (!q || x.name.toLowerCase().includes(q)));
  if (!items.length){ box.innerHTML = `<p class="none">${S.cat === "off" ? "No hay productos agotados 🎉" : "No encontré productos con ese nombre."}</p>`; return; }
  const groups = {}; items.forEach(x => (groups[x.category] = groups[x.category] || []).push(x));
  box.innerHTML = Object.entries(groups).map(([cat, list]) => `<h3 class="cat">${esc(cat)}</h3><div class="tiles">` + list.map(it => {
    const on = !S.dp.has(it.id);
    const subs = (it.options || []).map((name, i) => { const o = !(S.dop[it.id] && S.dop[it.id].has(String(i))); return `<div class="prow"><span>${esc(name)}</span><label class="sw"><input type="checkbox" data-o="${esc(it.id)}" data-i="${i}" ${o ? "checked" : ""} ${on ? "" : "disabled"} aria-label="${esc(it.name)} ${esc(name)} disponible"><i></i></label></div>`; }).join("");
    return `<div class="tile ${on ? "" : "off"}"><div class="ph" data-tap="${esc(it.id)}"><span class="ini">${esc((it.name || "?").trim().charAt(0))}</span>${it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}${on ? "" : '<span class="sold">AGOTADO</span>'}</div><div class="tb"><div><b>${esc(it.name)}</b><span class="state ${on ? "" : "off"}">${on ? "Disponible" : "Agotado"}</span></div><label class="sw"><input type="checkbox" data-p="${esc(it.id)}" ${on ? "checked" : ""} aria-label="${esc(it.name)} disponible"><i></i></label></div>${subs ? `<div class="subs">${subs}</div>` : ""}</div>`;
  }).join("") + "</div>").join("");
  if (keep) window.scrollTo(0, y);
}
async function save(){
  if (route() === "carta-local") return saveLocal();
  if (!dirty || saving) return; saving = true;
  const b = $("#saveBtn"); b.disabled = true; b.textContent = "Guardando…";
  try {
    const d = await call(API.av, { action:"set", disabledProducts:[...S.dp], disabledOptions:Object.fromEntries(Object.entries(S.dop).map(([id, s]) => [id, [...s]])) });
    setState(d); dirty = false; toast("Cambios guardados ✓", 2200); if (route() === "productos") vProducts(); $("#savebar").hidden = true;
  } catch(e){ toast(e.message); }
  finally { saving = false; b.disabled = false; b.textContent = "Guardar cambios"; }
}
$("#saveBtn").onclick = save;
window.addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });


/* ---------- carta local ---------- */
function locEff(it){ const o = S.loc.over[it.id] || {}; const e = { name:o.name || it.name, desc:o.desc != null ? o.desc : it.desc, price:o.price != null ? o.price : it.price, img:o.img === null ? it.img : (o.img || it.img), promo:o.promo || "", sub:o.sub || "", label:o.label || "" };
  e.own = !it.local && (e.name !== it.name || e.desc !== it.desc || e.price !== it.price || e.img !== it.img || !!e.promo || !!e.sub); return e; }
/* ---------- Horarios: la carta destaca distinto segun dia y hora ---------- */
const SCH = { site:"local", rules:{}, saved:{}, edit:null, busy:false };
const SCH_CAT = {
  local:{ combos:[["l-slice-bebida","Slice + Bebida"],["combo-del-don","Combo del Don"],["combo-complices","Combo Cómplices"],["combo-duo-del-don","Par de Mafiosos"],["l-familiar","Promo Familiar"],["l-pasta-familia","Pasta en Familia"]],
    bans:[["pastas","Nuevas Pastas"],["combos","Nuevos Combos"],["martes","Martes 50%"]] },
  online:{ combos:[["combo-famiglia","Combo Famiglia"],["combo-doble-capo","Combo Padrinos"],["combo-mafioso","Combo Mafioso"],["combo-complices","Combo Cómplices"],["combo-del-don","Combo del Don"],["combo-duo-del-don","Combo 2 Mafiosos"],["promo-alfredo","Promo Fetuccini Alfredo"]],
    bans:[["pastas","Nuevas Pastas"],["familiar","Combo Familiar"],["padrinos","Combo Padrinos"]] }
};
const SCH_DAYS = [[1,"L"],[2,"M"],[3,"X"],[4,"J"],[5,"V"],[6,"S"],[0,"D"]];
const SCH_SEC = [["combos","Combos"],["pizzas","Pizzas"],["nuestras-pastas","Pastas"]];
const schName = (list, id) => (list.find(x => x[0] === id) || [id, id])[1];
function schDays(d){
  d = [...d].sort(); const all = [0,1,2,3,4,5,6];
  if (d.length === 7) return "Todos los días";
  if (d.join() === "1,2,3,4,5") return "Lun a Vie";
  if (d.join() === "0,6") return "Sáb y Dom";
  const N = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  if (d.length < 3) return d.map(n => N[n]).join(" y ");
  return SCH_DAYS.filter(x => d.includes(x[0])).map(x => x[1]).join(" ");
}
function schSummary(r){
  const c = SCH_CAT[SCH.site], t = r.from === "00:00" && r.to === "24:00" ? "todo el día" : r.from + " a " + r.to;
  const first = r.top && r.top.length ? schName(c.combos, r.top[0]) : schName(SCH_SEC, r.first);
  return schDays(r.days) + " · " + t + " · Primero: " + first;
}
const schChip = msg => `<span class="chip sch-chip">${esc(String(msg || "SIN MENSAJE").split("|").join(" "))}</span>`;
async function schLoad(site){
  const r = await fetch(API.sch + "?site=" + site + "&t=" + Date.now(), { cache:"no-store" });
  const d = await r.json(); if (!r.ok) throw new Error(d.error || "No se pudo cargar");
  SCH.saved[site] = !!d.rules; SCH.rules[site] = JSON.parse(JSON.stringify(d.rules || d.defaults));
}
async function schSave(){
  await call(API.sch, { action:"set", site:SCH.site, rules:SCH.rules[SCH.site] });
  SCH.saved[SCH.site] = true; toast("Guardado. La carta lo toma al recargar.");
}
async function vSched(){
  const v = $("#view");
  if (!SCH.rules.local || !SCH.rules.online){
    v.innerHTML = '<p class="none">Cargando…</p>';
    try { await Promise.all([schLoad("local"), schLoad("online")]); }
    catch(e){ v.innerHTML = `<p class="none">${esc(e.message)}<br><button class="btn" id="retryS" type="button" style="margin-top:12px">Reintentar</button></p>`; $("#retryS").onclick = vSched; return; }
  }
  if (route() !== "horarios") return;
  SCH.edit === null ? schList() : schEdit();
}
function schList(){
  const rules = SCH.rules[SCH.site];
  $("#view").innerHTML = `<div class="sch">
    <h2 class="sch-h2">Horarios automáticos</h2><p class="sch-s">La carta destaca distinto según día y hora (hora de Chile).</p>
    <div class="sch-seg"><button type="button" data-site="local" class="${SCH.site === "local" ? "on" : ""}">Carta local</button><button type="button" data-site="online" class="${SCH.site === "online" ? "on" : ""}">Carta online</button></div>
    ${rules.map((r, i) => `<div class="sch-card" data-i="${i}"><div class="sch-row">${schChip(r.msg)}<span class="sp"></span><button type="button" class="sch-sw ${r.on === false ? "off" : ""}" data-tog="${i}" role="switch" aria-checked="${r.on !== false}" aria-label="Activar o desactivar"></button></div><div class="sch-m">${r.tag ? `<b>${esc(r.tag)}</b> · ` : ""}${esc(schSummary(r))}</div></div>`).join("")}

// Reduce la foto en el teléfono antes de subirla (máx. 1200 px).
function shrink(file){
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      ok(c.toDataURL("image/jpeg", .82));
    };
    img.onerror = () => no(new Error("No pude leer esa foto"));
    img.src = u;
  });
}

function loadLeaflet(){
  if (window.L) return Promise.resolve();
  return new Promise((ok, no) => {
    const c = document.createElement("link"); c.rel = "stylesheet"; c.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(c);
    const j = document.createElement("script"); j.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; j.onload = ok; j.onerror = () => no(new Error("No se pudo cargar el mapa. Revisa tu conexión.")); document.head.appendChild(j);
  });
}
async function runMap(days){
  const token = S.mapTok = (S.mapTok || 0) + 1;
  const live = () => token === S.mapTok && route() === "resumen";
  let map;
  try {
    await loadLeaflet(); if (!live()) return;
    map = L.map("mmap", { preferCanvas:true, zoomControl:true }).setView([-20.235, -70.135], 12);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(map);
    L.circleMarker([-20.2330, -70.1400], { radius:7, color:"#fff", weight:2, fillColor:"#141414", fillOpacity:1 }).addTo(map).bindTooltip("MAFIA", { permanent:false });
  } catch(e){ $("#mprog").textContent = e.message; return; }
  const layer = L.layerGroup().addTo(map); let fitted = false, lastErr = 0;
  for (let i = 0; i < 80 && live(); i++){
    let d;
    try { d = await call(API.geo, { days }); } catch(e){ if (!live()) return; $("#mprog").innerHTML = `${esc(e.message)} <button class="ledit" id="mretry" type="button">Reintentar</button>`; $("#mretry").onclick = vMap; return; }
    if (!live()) return;
    drawMap(map, layer, d, !fitted); if (d.points.length) fitted = true;
    if (d.error){ if (++lastErr >= 3){ $("#mprog").textContent = "El servicio de mapas no responde ahora. Vuelve a abrir esta pantalla en unos minutos para seguir."; return; } }
    if (!d.pending) { $("#mprog").textContent = ""; return; }
    $("#mprog").textContent = `Ubicando direcciones… faltan ${d.pending}`;
  }
}
function drawMap(map, layer, d, fit){
  layer.clearLayers();
  const max = Math.max(1, ...d.points.map(p => p.count));
  d.points.slice().sort((a, b) => a.count - b.count).forEach(p => {
    const t = p.count / max, r = 7 + Math.sqrt(p.count) * 4;
    L.circleMarker([p.lat, p.lng], { radius:r, color:"#8f0b20", weight:1, fillColor:"#c8102e", fillOpacity:.25 + .5 * t })
      .bindTooltip(`${esc(p.address)}<br><b>${p.count} ${p.count === 1 ? "pedido" : "pedidos"}</b> · ${clp(p.amount)}${p.approx ? "<br><i>ubicación aproximada (calle)</i>" : ""}`).addTo(layer);
  });
  if (fit && d.points.length) map.fitBounds(L.latLngBounds(d.points.map(p => [p.lat, p.lng])).pad(.2), { maxZoom:15 });
  const located = d.points.reduce((t, p) => t + p.count, 0), sum = d.points.reduce((t, p) => t + p.amount, 0);
  $("#mst").innerHTML = `<div><b>${d.orders}</b><span>pedidos con delivery</span></div><div><b>${located}</b><span>ubicados en el mapa</span></div><div><b>${d.points.length}</b><span>direcciones distintas</span></div><div><b>${clp(d.orders ? Math.round(sum / Math.max(1, located)) : 0)}</b><span>ticket promedio</span></div>`;
  const streets = {}; d.points.forEach(p => { const k = p.street || p.address.toLowerCase(); streets[k] = (streets[k] || 0) + p.count; });
  const top = Object.entries(streets).sort((a, b) => b[1] - a[1]).slice(0, 8), m = top.length ? top[0][1] : 1;
  $("#mtop").innerHTML = top.length ? `<div class="mp-top"><h3>Calles que más piden</h3>${top.map(([k, n]) => `<div class="mp-r"><span>${esc(k)}</span><span class="mp-bar"><u style="width:${Math.round(n / m * 100)}%"></u></span><i>${n}</i></div>`).join("")}</div>` : "";
  $("#mfail").innerHTML = d.failed.length ? `No pude ubicar ${d.failed.length} ${d.failed.length === 1 ? "dirección" : "direcciones"} (${d.failed.reduce((t, f) => t + f.count, 0)} en total): ${d.failed.slice(0, 6).map(f => esc(f.address)).join(" · ")}${d.failed.length > 6 ? "…" : ""}. Suelen ser direcciones incompletas o con errores de escritura.` : "";
  if (!d.orders && !d.pending) $("#mprog").textContent = "Aún no hay pedidos con delivery en este período.";
}

  const heat = `<div class="rs-hm" style="grid-template-columns:44px repeat(${HRS.length},1fr)"><div></div>${HRS.map(h => `<div class="h">${h}h</div>`).join("")}${grid.map((row, r) => `<div class="d">${DOW[r]}</div>` + row.map(v => { const a = v / gmax; return `<div style="background:${v ? `rgba(200,16,46,${(.12 + a * .88).toFixed(2)})` : "#f1eee6"};color:${a > .5 ? "#fff" : "#6f6a5f"}">${v || ""}</div>`; }).join("")).join("")}</div>`;
  // productos
  const prod = {}, cats = {};
  L.forEach(o => (o.items || []).forEach(i => { const r = prod[i.name] = prod[i.name] || { q:0, a:0 }; r.q += i.quantity; r.a += i.total_amount || 0; const c = catOf(i.name); cats[c] = (cats[c] || 0) + i.quantity; }));
  const top = Object.entries(prod).sort((a, b) => b[1].q - a[1].q).slice(0, 10), maxQ = top[0] ? top[0][1].q : 1;
  const CC = { Pizzas:RS.red, Pastas:RS.ink, Combos:RS.red2, Bebidas:RS.g2, Extras:RS.g1 };
  const u = D.unp, k$ = v => "$" + kfmt(Math.round(v));
  box.innerHTML = `
    <div class="rs-ph">Resumen de ventas MAFIA · ${label} · generado el ${new Date().toLocaleString("es-CL")}</div>
    <div class="rs-kpis">
      <div class="rs-k hi"><span>Ventas</span><strong>${money(total)}</strong>${delta(total, ptotal)}</div>
      <div class="rs-k"><span>Pedidos</span><strong>${n}</strong>${delta(n, P.length)}</div>
      <div class="rs-k"><span>Ticket promedio</span><strong>${money(tk)}</strong>${delta(tk, ptk)}</div>
      <div class="rs-k"><span>Pedidos por cliente</span><strong>${ppc.toFixed(1).replace(".", ",")}</strong>${pppc ? `<em class="${ppc >= pppc ? "rs-up" : "rs-dn"}">${ppc >= pppc ? "+" : "−"}${Math.abs(ppc - pppc).toFixed(1).replace(".", ",")}</em>` : '<em class="rs-m">sin datos previos</em>'}</div>
    </div>
    ${u ? `<div class="rs-kpis rs-k3"><div class="rs-k"><span>Llegaron a pagar</span><strong>${u.started}</strong></div><div class="rs-k"><span>Terminaron su compra</span><strong>${pct(u.paid, u.started)}%</strong></div><div class="rs-k"><span>No pagaron</span><strong class="rs-dn">${u.started - u.paid}</strong></div></div>` : ""}
    <div class="rs-card"><h3>${D.days === 1 ? "Ventas por hora" : "Ventas por día"}</h3>${rsBars(ser, { avg:avgSer, fmt:k$ })}<p class="rs-note">Línea punteada: promedio ${D.days === 1 ? "por hora" : "diario"}, ${money(avgSer)}. En verde, el mejor ${D.days === 1 ? "horario" : "día"}.</p></div>
    ${D.days > 1 ? `<div class="rs-card"><h3>Cuándo piden</h3>${heat}<p class="rs-note">Cantidad de pedidos por día y hora. Más oscuro es más pedidos. Hora punta: ${DOW[best[0]]} a las ${HRS[best[1]]}:00 (${grid[best[0]][best[1]]} pedidos).</p></div>` : ""}
    <div class="rs-row3">
      <div class="rs-card"><h3>Quién compra</h3>${rsDonut([["Mujeres", gF.length, RS.red], ["Hombres", gM.length, RS.ink], ["No identificado", gX.length, RS.g2]])}<p class="rs-note">Estimado por el primer nombre del cliente. No es exacto.</p></div>
      <div class="rs-card"><h3>Delivery y retiro</h3>${rsDonut([["Delivery", del.length, RS.red], ["Retiro", ret.length, RS.ink]])}</div>
      <div class="rs-card"><h3>Tipo de producto</h3>${rsDonut(Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, v, CC[k]]))}<p class="rs-note">Unidades vendidas, clasificadas por nombre.</p></div>
    </div>
    <div class="rs-row2">
      ${D.days > 1 ? `<div class="rs-card"><h3>Ticket promedio por día de la semana</h3>${rsBars(DOW.map((d, i) => [d, dn[i] ? dsum[i] / dn[i] : 0]), { h:170, avg:tk, fmt:k$, best:false, W:620 })}</div>` : ""}
      <div class="rs-card"><h3>Ticket promedio según</h3><div class="rs-leg rs-tk">
        <div><i style="background:${RS.red}"></i>Mujeres<b>${gF.length ? money(avg(gF)) : "—"}</b></div><div><i style="background:${RS.ink}"></i>Hombres<b>${gM.length ? money(avg(gM)) : "—"}</b></div><div><i style="background:${RS.g2}"></i>No identificado<b>${gX.length ? money(avg(gX)) : "—"}</b></div>
        <div class="rs-sep"><i style="background:${RS.red2}"></i>Delivery<b>${del.length ? money(avg(del)) : "—"}</b></div><div><i style="background:${RS.g1}"></i>Retiro<b>${ret.length ? money(avg(ret)) : "—"}</b></div></div></div>
    </div>
    <div class="rs-card"><h3>Productos más vendidos</h3>${top.map(([k, r], i) => `<div class="rs-prod"><span class="n">${i + 1}</span><div>${esc(k)}<div class="bar2"><u style="width:${pct(r.q, maxQ)}%"></u></div></div><span class="q">${r.q} u.</span><span class="a">${money(r.a)}</span></div>`).join("")}</div>
    <div class="rs-card"><h3>Desde dónde nos piden</h3>
      <p class="mp-help">Cada círculo es una dirección con delivery. Más grande y más rojo = más pedidos. Se ubican de a poco y el mapa se completa solo.</p>
      <div class="mp-st" id="mst"></div><div class="mp-prog rs-noprint" id="mprog"></div>
      <div class="mp-map" id="mmap"></div><div id="mtop"></div><div class="mp-fail" id="mfail"></div></div>`;
  runMap(D.days);
}

/* ---------- pedidos (antes /caja/) ---------- */
const STATES = ["nuevo", "preparacion", "listo", "entregado"];
const TAB = { nuevo:"Nuevos", preparacion:"Preparación", listo:"Listos", entregado:"Entregados" };
const NEXT = { nuevo:["preparacion", "Aceptar pedido", "accept"], preparacion:["listo", "Marcar listo", "ready"], listo:["entregado", "Marcar entregado", ""] };
const hhmm = d => new Date(d).toLocaleTimeString("es-CL", { hour:"2-digit", minute:"2-digit" });
const ago = d => { const m = Math.max(0, Math.round((Date.now() - new Date(d).getTime()) / 60000)); return m < 1 ? "ahora" : m < 60 ? "hace " + m + " min" : "hace " + Math.floor(m / 60) + " h"; };
const waNum = p => { let d = String(p || "").replace(/\D/g, ""); if (d.length === 9 && d[0] === "9") d = "56" + d; return d; };
const pendingN = () => S.orders.filter(o => o.kitchen_status === "nuevo").length;
const inTab = st => S.orders.filter(o => o.kitchen_status === st).sort((a, b) => st === "entregado" ? b.paid_at.localeCompare(a.paid_at) : a.paid_at.localeCompare(b.paid_at));

/* sonido, pantalla encendida y alarma mientras haya pedidos sin aceptar */
let soundOn = false, ctx = null, lock = null, alarm = null, flash = null;
function audioReady(){ try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); return ctx.state !== "closed"; } catch(e){ return false; } }
function ring(){
  if (!soundOn || !audioReady()) return;
  [880, 1175, 1480].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime + i * .2; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.start(t); o.stop(t + .19); });
}
async function keepAwake(){ try { if (navigator.wakeLock && !lock){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch(e){} }
function setSound(on){ soundOn = on; if (on){ audioReady(); keepAwake(); } const b = $("#soundBtn"); b.setAttribute("aria-pressed", on); b.innerHTML = on ? I.bell : I.bellOff; b.style.color = on ? "var(--text)" : "var(--muted)"; b.title = on ? "Sonido activo" : "Sonido apagado"; syncAlarm(); if (route() === "pedidos") drawOrders(); }
$("#soundBtn").onclick = () => setSound(!soundOn);
function syncAlarm(){
  const n = pendingN(); clearInterval(alarm); clearInterval(flash);
  const base = "MAFIA · " + VIEWS[route()];
  if (n){
    if (soundOn){ ring(); alarm = setInterval(ring, 5000); }
    let on = false; flash = setInterval(() => { on = !on; document.title = on ? "(" + n + ") ¡Pedido nuevo!" : base; }, 1000);
  } else document.title = base;
  syncAlert();
}
function syncAlert(){
  const n = pendingN(), el = $("#alertbar");
  el.hidden = !n || route() === "pedidos";
  el.innerHTML = '<span class="dot"></span>' + (n === 1 ? "1 pedido por aceptar" : n + " pedidos por aceptar") + ' <span style="margin-left:auto;font-weight:800">Ver</span>';
}
$("#alertbar").onclick = () => { S.tab = "nuevo"; S.sel = null; location.hash = "#/pedidos"; };

async function loadOrders(){
  try {
    const d = await call(API.ord, { days:3 });
    const prev = S.known; S.orders = d.orders || [];
    const fresh = prev ? S.orders.filter(o => !prev.has(o.reference)) : [];
    S.known = new Set(S.orders.map(o => o.reference));
    if (fresh.length){ S.tab = "nuevo"; }
    const since = Date.now() - 864e5, day = S.orders.filter(o => new Date(o.paid_at).getTime() >= since);
    S.today = { n:day.length, total:day.reduce((t, x) => t + (x.paid_total ?? x.total ?? 0), 0), nuevos:pendingN() };
    syncAlarm(); drawNav();
    const v = route(); if (v === "pedidos") drawOrders(); else if (v === "inicio") vHome();
  } catch(e){
    if (e.status === 401){ sessionStorage.removeItem("mafia_caja_pw"); location.reload(); return; }
    toast("Sin conexión, reintentando…");
  }
}

function vOrders(){
  $("#view").innerHTML = `<div class="ord" id="ord"><section class="ocol"><div class="otabs" id="otabs"></div><div class="olist" id="olist"></div></section><section class="dcol" id="dcol"></section></div>`;
  $("#otabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b){ S.tab = b.dataset.tab; S.sel = null; drawOrders(); } };
  $("#olist").onclick = e => { const r = e.target.closest("[data-ref]"); if (r){ S.sel = r.dataset.ref; drawOrders(); window.scrollTo(0, 0); } };
  $("#dcol").onclick = onDetailClick;
  S.sig = ""; drawOrders();
}
const ST_LBL = { nuevo:"Nuevo", preparacion:"En preparación", listo:"Listo", entregado:"Entregado" };
const stars = n => `<span class="stars" aria-label="${n} de 5">${[1,2,3,4,5].map(k => k <= n ? "★" : "<s>★</s>").join("")}</span>`;
const avgStars = o => { const r = o.ratings && o.ratings.items; return r && r.length ? Math.round(r.reduce((t, x) => t + x.stars, 0) / r.length) : 0; };
const tipoChip = o => o.delivery_type === "delivery" ? '<span class="tg del">Delivery</span>' : '<span class="tg ret">Retiro</span>';
function drawOrders(){
  if (!$("#ord")) return;
  $("#otabs").innerHTML = STATES.map(st => { const n = inTab(st).length; return `<button class="otab${st === "nuevo" && n ? " hot" : ""}" type="button" data-st="${st}" data-tab="${st}" aria-pressed="${S.tab === st}">${TAB[st]}<b>${n}</b></button>`; }).join("");
  const list = inTab(S.tab);
  $("#olist").innerHTML = list.length ? list.map(o => `<button class="orow${o.kitchen_status === "nuevo" ? " new" : ""}" type="button" data-st="${o.kitchen_status}" data-ref="${esc(o.reference)}" aria-current="${S.sel === o.reference}"><span class="n">#${esc(o.short_code)}</span><span class="t">${clp(o.paid_total ?? o.total)}</span><span class="s">${tipoChip(o)}${esc(o.customer.name)}</span><span class="w">${o.kitchen_status === "nuevo" ? ago(o.paid_at) : hhmm(o.paid_at)}</span><span class="i">${o.items.map(i => i.quantity + "× " + esc(i.name)).join(", ")}</span>${avgStars(o) ? `<span class="rt">${stars(avgStars(o))}</span>` : ""}</button>`).join("") : `<p class="none">Sin pedidos en “${TAB[S.tab]}”.</p>`;
  $("#ord").classList.toggle("has-sel", !!S.sel && !!S.orders.find(x => x.reference === S.sel));
  const o = S.orders.find(x => x.reference === S.sel);
  const sig = o ? JSON.stringify([o.reference, o.kitchen_status, o.duplicate_payments, S.msgOpen === o.reference, o.ratings]) : "";
  if (sig !== S.sig || !o){ S.sig = sig; drawDetail(o); }          /* no se redibuja si nada cambió (así no se pierde un mensaje que estás editando) */
}
function clientMsg(o){
  const c = o.customer || {}, del = o.delivery_type === "delivery", st = o.kitchen_status, name = (c.name || "").trim().split(/\s+/)[0] || "";
  const items = o.items.map(i => `• ${i.quantity}× ${i.name}${i.detail && i.detail.length ? " (" + i.detail.join(", ") + ")" : ""}`).join("\n");
  const resumen = `Pedido #${o.short_code}\n${items}\nTotal pagado: ${clp(o.paid_total ?? o.total)}`, hola = `Hola ${name}, `;
  if (st === "entregado") return `${hola}confirmamos la entrega de tu pedido #${o.short_code}. ¡Gracias por pedir en MAFIA! Si hubo algún problema con tu pedido, respóndenos por aquí y lo resolvemos.`;
  if (st === "listo") return del
    ? `${hola}tu pedido está listo y acaba de salir del local hacia ${o.address}${c.unit ? " (" + c.unit + ")" : ""}.\n\n${resumen}\n\nPor favor confírmanos por este mismo chat cuando lo recibas. ¡Gracias por pedir en MAFIA!`
    : `${hola}tu pedido está listo para retirar en el local.\n\n${resumen}\n\nTe esperamos. ¡Gracias por pedir en MAFIA!`;
  return `${hola}recibimos tu pedido y ya lo estamos preparando.\n\n${resumen}\n\nTe avisamos por aquí apenas ${del ? "salga del local" : "esté listo para retirar"}. ¡Gracias por pedir en MAFIA!`;
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){ const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch(_){} ta.remove(); return ok; }
}
function drawDetail(o){
  const box = $("#dcol"); if (!box) return;
  if (!o){ box.innerHTML = '<p class="none2">Elige un pedido para ver el detalle</p>'; return; }
  const c = o.customer || {}, del = o.delivery_type === "delivery", nx = NEXT[o.kitchen_status], prev = STATES[STATES.indexOf(o.kitchen_status) - 1];
  const canMsg = !!c.phone && o.kitchen_status !== "nuevo";
  const imgOf = n => { const m = S.catalog.find(x => x.img && x.name === n) || S.catalog.find(x => x.img && (n.startsWith(x.name) || x.name.startsWith(n))); return m ? m.img : ""; };
  box.innerHTML = `
    <button class="d-back" id="dback" type="button">Volver a pedidos</button>
    <div class="d-head"><span class="d-num">#${esc(o.short_code)}</span>${tipoChip(o)}<span class="d-meta">${hhmm(o.paid_at)}</span></div>
    <div class="blk d-items">${o.items.map((i, ix) => { const rv = o.ratings && o.ratings.items && o.ratings.items.find(r => r.i === ix), im = imgOf(i.name); return `<div class="it2">${im ? `<img class="pi" src="${esc(im)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'pi ph0'}))">` : `<span class="pi ph0"></span>`}<div class="nm"><b><em class="q">${i.quantity}×</em> ${esc(i.name)}</b>${i.detail && i.detail.length ? `<small>${i.detail.map(esc).join(" · ")}</small>` : ""}${rv ? `<span class="rv">${stars(rv.stars)}${rv.comment ? `<em>“${esc(rv.comment)}”</em>` : ""}</span>` : ""}</div><span class="p">${clp(i.total_amount)}</span></div>`; }).join("")}
      ${del ? `<div class="d-sum"><span>Delivery</span><span>${clp(o.delivery_fee)}</span></div>` : ""}
      <div class="d-tot"><span>Total pagado</span><div><b>${clp(o.paid_total ?? o.total)}</b></div></div></div>
    <div class="blk cl"><div class="cl1"><b>${esc(c.name)}</b>${c.phone ? `<span>${esc(c.phone)}</span>` : ""}</div>
      ${del ? `<div class="cl2"><span class="d-lbl">Dirección</span>${esc(o.address)}${c.unit ? " · " + esc(c.unit) : ""}</div>` : ""}
      ${c.notes ? `<div class="d-note"><span class="d-lbl">Nota del cliente</span>${esc(c.notes)}</div>` : ""}</div>
    ${(o.duplicate_payments || []).length ? `<div class="d-warn">Posible doble cobro en Mercado Pago. Revisa y devuelve si corresponde.</div>` : ""}
    <details class="more"><summary>Más detalles</summary>
      <dl class="d-rows">
        ${c.email ? `<div><dt>Correo</dt><dd>${esc(c.email)}</dd></div>` : ""}
        <div><dt>Pagado</dt><dd>${new Date(o.paid_at).toLocaleDateString("es-CL", { day:"numeric", month:"short" })} ${hhmm(o.paid_at)}<small>${/^(processed|approved|accredited|paid)$/i.test(o.payment_status || "") || !o.payment_status ? "Aprobado" : esc(o.payment_status)}</small></dd></div>
        <div><dt>Aceptado</dt><dd>${o.accepted_at ? hhmm(o.accepted_at) + `<small>${Math.max(0, Math.round((new Date(o.accepted_at) - new Date(o.paid_at)) / 60000))} min después del pago</small>` : "Aún no"}</dd></div>
        <div><dt>N° de pedido</dt><dd>#${esc(o.short_code)}<small>${esc(o.reference)}</small></dd></div>
        ${o.mp_order_id ? `<div><dt>ID Mercado Pago</dt><dd>${esc(o.mp_order_id)}</dd></div>` : ""}
      </dl></details>
    <div class="d-act">
      ${o.kitchen_status === "nuevo" ? `<p class="d-hint">Ingrésalo en Fudo y luego acepta</p>` : ""}
      ${nx ? `<button class="go ${nx[2]}" id="go" type="button" data-to="${nx[0]}">${nx[1]}</button>` : ""}
      <div class="sec">${canMsg ? `<button type="button" class="wabtn" id="wa" data-phone="${esc(waNum(c.phone))}"><svg viewBox="0 0 24 24"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.4-4.3A8.5 8.5 0 1 1 20.5 11.7Z"/><path d="M9 8.6c.3 2.6 2.4 4.9 5.3 6l1.2-1.1-1.6-1-.8.6c-.9-.4-1.7-1.2-2.1-2.1l.6-.8-1-1.6Z"/></svg>Contactar cliente</button>` : ""}${prev ? `<button type="button" class="undo" id="undo" data-to="${prev}" title="Devolver a ${TAB[prev]}" aria-label="Devolver a ${TAB[prev]}"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>` : ""}</div>
    </div>`;
}
async function move(to){
  const o = S.orders.find(x => x.reference === S.sel); if (!o) return;
  try {
    await call(API.upd, { reference:o.reference, kitchen_status:to });
    o.kitchen_status = to; if (to !== "nuevo" && !o.accepted_at) o.accepted_at = new Date().toISOString();
    S.tab = to; S.today && (S.today.nuevos = pendingN());
    if (to !== "listo" && to !== "entregado") S.sel = null;
    S.sig = ""; drawOrders(); syncAlarm(); drawNav();
  } catch(e){ toast(e.message); }
}
function onDetailClick(e){
  if (e.target.closest("#dback")){ S.sel = null; drawOrders(); return; }
  const wa = e.target.closest("#wa");
  if (wa){ const o = S.orders.find(x => x.reference === S.sel); if (o){ try { navigator.clipboard && navigator.clipboard.writeText(clientMsg(o)); } catch(err){} toast("Mensaje simulado para " + (o.customer && o.customer.name || "el cliente") + ": " + clientMsg(o), 7000); } return; }
  const b = e.target.closest("[data-to]"); if (b) move(b.dataset.to);
}
async function loadPay(){ try { S.pay = await call(API.pay, { action:"get" }); const v = route(); if (v === "pago") vPay(); else if (v === "inicio") vHome(); } catch(e){} }

/* ---------- acceso (una sola clave para todo el panel; la sesión se recuerda mientras la pestaña esté abierta) ---------- */
let started = false;
async function enter(){
  const d = await call(API.av, { action:"login" });
  S.catalog = d.catalog || []; role = d.role || "staff"; setState(d);
  try { sessionStorage.setItem("mafia_caja_pw", pass); } catch(e){}
  $("#loginWrap").hidden = true; $("#shell").hidden = false; started = true;
  setSound(false); render();
  if (isAdmin()){ loadPay(); loadUnpaid(); }
  loadOrders(); setInterval(loadOrders, 7000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ loadOrders(); if (soundOn) keepAwake(); } });
}
$("#login").addEventListener("submit", async e => {
  e.preventDefault(); pass = $("#password").value; if (!pass) return; $("#loginErr").textContent = "";
  audioReady();                                   /* el toque en "Entrar" permite activar el sonido */
  try { await enter(); setSound(true); }
  catch(err){ $("#loginErr").textContent = err.status === 401 ? "Clave incorrecta" : err.message; pass = ""; }
});
$("#logout").onclick = () => { try { sessionStorage.removeItem("mafia_caja_pw"); } catch(e){} location.reload(); };
(async () => { let saved = ""; try { saved = sessionStorage.getItem("mafia_caja_pw") || ""; } catch(e){}
  if (!saved) return; pass = saved; $("#loginWrap").hidden = true;
  try { await enter(); } catch(err){ pass = ""; $("#loginWrap").hidden = false; try { sessionStorage.removeItem("mafia_caja_pw"); } catch(e){} } })();
</script>
